name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write        # needed to publish the built site to gh-pages

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rules engine tests
        run: node tools/selftest.mjs
      - name: Full-run fuzz
        run: node tools/simulate.mjs 120
      - name: Single-file bundle builds
        run: node tools/bundle.mjs

  publish:
    needs: test
    # Pages serves the default branch only; other branches still run the tests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The site is the repo — there is no build step for the app itself.
      # Only the one-file download is generated.
      - name: Assemble site
        run: |
          node tools/bundle.mjs
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons dist _site/
          # Stop Pages running the output through Jekyll.
          touch _site/.nojekyll

      # Published to the gh-pages branch rather than through the Pages-Actions
      # source. Pushing that branch is what enabled Pages on this repository in
      # the first place: enabling it via the API needs admin rights GITHUB_TOKEN
      # does not have, so `configure-pages` could only ever fail with
      # "Resource not accessible by integration". Publishing to the branch keeps
      # deploys automatic with no repository setting left to change.
      - name: Publish to gh-pages
        working-directory: _site
        run: |
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Deploy ${GITHUB_SHA} from main"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the live URL
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          {
            echo "### Deployed"
            echo "https://${owner}.github.io/${repo}/"
          } >> "$GITHUB_STEP_SUMMARY"
