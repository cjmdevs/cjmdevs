name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Preview branches deploy too, so the site is live before any merge.
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rules engine tests
        run: node tools/selftest.mjs
      - name: Full-run fuzz
        run: node tools/simulate.mjs 120

  deploy:
    needs: test
    # Pages restricts the github-pages environment to the default branch, so
    # only main deploys. Other branches still run the test job above.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The site is the repo — there is no build step for the app itself.
      # Only the one-file download is generated.
      - name: Assemble site
        run: |
          node tools/bundle.mjs
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
          cp -r dist _site/
          # Stop Pages running the output through Jekyll.
          touch _site/.nojekyll

      # No `enablement: true` here. Creating a Pages site needs repository admin
      # rights, and GITHUB_TOKEN does not have them:
      #   Create Pages site failed. Error: Resource not accessible by integration
      # Pages must be switched on once by a repo admin, under
      # Settings -> Pages -> Source: GitHub Actions.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain a missing Pages configuration
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Open Settings -> Pages and set Source to 'GitHub Actions', then re-run this workflow. A workflow token cannot enable Pages itself."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
