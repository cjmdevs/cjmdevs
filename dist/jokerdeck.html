  { key: 'nacho_tong', name: 'Nacho Tong', cost: 10, needs: 'grabber', desc: '+1 more hand every round' },
  { key: 'wasteful', name: 'Wasteful', cost: 10, desc: '+1 discard every round' },
  { key: 'recyclomancy', name: 'Recyclomancy', cost: 10, needs: 'wasteful', desc: '+1 more discard every round' },
  { key: 'tarot_merchant', name: 'Tarot Merchant', cost: 10, desc: 'Tarot cards appear twice as often in the shop' },
  { key: 'tarot_tycoon', name: 'Tarot Tycoon', cost: 20, needs: 'tarot_merchant', desc: 'Tarot cards appear four times as often in the shop' },
  { key: 'planet_merchant', name: 'Planet Merchant', cost: 10, desc: 'Planet cards appear twice as often in the shop' },
  { key: 'planet_tycoon', name: 'Planet Tycoon', cost: 20, needs: 'planet_merchant', desc: 'Planet cards appear four times as often in the shop' },
  { key: 'seed_money', name: 'Seed Money', cost: 10, desc: 'Raises the interest cap to $10 per round' },
  { key: 'money_tree', name: 'Money Tree', cost: 20, needs: 'seed_money', desc: 'Raises the interest cap to $20 per round' },
  { key: 'blank', name: 'Blank', cost: 10, desc: 'Does nothing at all' },
  { key: 'antimatter', name: 'Antimatter', cost: 20, needs: 'blank', desc: '+1 Joker slot' },
  { key: 'magic_trick', name: 'Magic Trick', cost: 10, desc: 'Playing cards can be bought from the shop' },
  { key: 'illusion', name: 'Illusion', cost: 20, needs: 'magic_trick', desc: 'Playing cards in the shop may have an enhancement, edition or seal' },
  { key: 'paint_brush', name: 'Paint Brush', cost: 10, desc: '+1 hand size' },
  { key: 'palette', name: 'Palette', cost: 20, needs: 'paint_brush', desc: '+1 more hand size' },
  { key: 'directors_cut', name: "Director's Cut", cost: 20, desc: 'Reroll the Boss Blind once per ante for $10' },
  { key: 'hieroglyph', name: 'Hieroglyph', cost: 20, desc: '-1 Ante, but -1 hand every round' },
  { key: 'petroglyph', name: 'Petroglyph', cost: 20, needs: 'hieroglyph', desc: '-1 Ante, but -1 discard every round' },
];

const VOUCHER_BY_KEY = Object.fromEntries(VOUCHERS.map((v) => [v.key, v]));

/** A voucher is offerable once its prerequisite is owned and it is not. */
function availableVouchers(owned) {
  return VOUCHERS.filter((v) => !owned.has(v.key) && (!v.needs || owned.has(v.needs)));
}

// ----------------------------------------------------------------- Packs ----

const PACKS = [
  { key: 'arcana', name: 'Arcana Pack', kind: 'tarot', cost: 4, size: 3, choose: 1, weight: 4 },
  { key: 'arcana_jumbo', name: 'Jumbo Arcana Pack', kind: 'tarot', cost: 6, size: 5, choose: 1, weight: 2 },
  { key: 'arcana_mega', name: 'Mega Arcana Pack', kind: 'tarot', cost: 8, size: 5, choose: 2, weight: 0.5 },
  { key: 'celestial', name: 'Celestial Pack', kind: 'planet', cost: 4, size: 3, choose: 1, weight: 4 },
  { key: 'celestial_jumbo', name: 'Jumbo Celestial Pack', kind: 'planet', cost: 6, size: 5, choose: 1, weight: 2 },
  { key: 'celestial_mega', name: 'Mega Celestial Pack', kind: 'planet', cost: 8, size: 5, choose: 2, weight: 0.5 },
  { key: 'standard', name: 'Standard Pack', kind: 'card', cost: 4, size: 3, choose: 1, weight: 4 },
  { key: 'standard_jumbo', name: 'Jumbo Standard Pack', kind: 'card', cost: 6, size: 5, choose: 1, weight: 2 },
  { key: 'standard_mega', name: 'Mega Standard Pack', kind: 'card', cost: 8, size: 5, choose: 2, weight: 0.5 },
  { key: 'buffoon', name: 'Buffoon Pack', kind: 'joker', cost: 4, size: 2, choose: 1, weight: 1.2 },
  { key: 'buffoon_jumbo', name: 'Jumbo Buffoon Pack', kind: 'joker', cost: 6, size: 4, choose: 1, weight: 0.6 },
  { key: 'buffoon_mega', name: 'Mega Buffoon Pack', kind: 'joker', cost: 8, size: 4, choose: 2, weight: 0.3 },
  { key: 'spectral', name: 'Spectral Pack', kind: 'spectral', cost: 4, size: 2, choose: 1, weight: 0.6 },
  { key: 'spectral_jumbo', name: 'Jumbo Spectral Pack', kind: 'spectral', cost: 6, size: 4, choose: 1, weight: 0.3 },
  { key: 'spectral_mega', name: 'Mega Spectral Pack', kind: 'spectral', cost: 8, size: 4, choose: 2, weight: 0.15 },
];

const PACK_BY_KEY = Object.fromEntries(PACKS.map((p) => [p.key, p]));

// -------------------------------------------------------------- Building ----

function editionRoll(rng, honeLevel) {
  // Base odds are deliberately stingy; Hone / Glow Up multiply them.
  const scale = honeLevel;
  const r = rng.float();
  if (r < 0.003 * scale) return 'poly';
  if (r < 0.003 * scale + 0.014 * scale) return 'holo';
  if (r < 0.003 * scale + 0.014 * scale + 0.02 * scale) return 'foil';
  return null;
}

function rollJoker(rng, G, { forceRarity = null, allowEdition = true } = {}) {
  const owned = new Set(G.jokers.map((j) => j.key));
  let pool = shopPool(owned);
  if (forceRarity === 4) pool = JOKERS.filter((d) => d.legendary);
  else if (forceRarity) pool = pool.filter((d) => d.rarity === forceRarity);
  if (!pool.length) pool = shopPool(new Set());

  const def = forceRarity
    ? rng.pick(pool)
    : rng.weighted(pool, (d) => RARITY_WEIGHT[d.rarity] ?? 0);

  const edition = allowEdition ? editionRoll(rng, G.derived.honeLevel) : null;
  return makeJoker(def.key, edition);
}

function rollConsumable(rng, G, type) {
  const keys = type === 'planet' ? PLANET_KEYS : type === 'spectral' ? SPECTRAL_KEYS : TAROT_KEYS;
  return makeConsumable(rng.pick(keys));
}

function rollPlayingCard(rng, G, { fancy = false } = {}) {
  const c = makeCard(rng.pick(RANKS), rng.pick(SUIT_KEYS));
  if (fancy) {
    if (rng.chance(2, 5)) c.enhancement = rng.pick(['bonus', 'mult', 'wild', 'glass', 'steel', 'gold', 'lucky']);
    const ed = editionRoll(rng, Math.max(2, G.derived.honeLevel));
    if (ed) c.edition = ed;
    if (rng.chance(1, 10)) c.seal = rng.pick(['gold', 'red', 'blue', 'purple']);
  }
  return c;
}

/** One purchasable slot in the shop's top row. */
function rollShopItem(rng, G) {
  const d = G.derived;
  const options = [
    { kind: 'joker', w: 20 },
    { kind: 'tarot', w: 4 * d.tarotRate },
    { kind: 'planet', w: 4 * d.planetRate },
    { kind: 'card', w: d.shopCards ? 4 : 0 },
    { kind: 'spectral', w: 0.6 },
  ].filter((o) => o.w > 0);

  const kind = rng.weighted(options, (o) => o.w).kind;
  if (kind === 'joker') {
    const j = rollJoker(rng, G);
    return { id: uid('s'), kind: 'joker', payload: j, cost: jokerPrice(j) };
  }
  if (kind === 'card') {
    const c = rollPlayingCard(rng, G, { fancy: G.vouchers.has('illusion') });
    return { id: uid('s'), kind: 'card', payload: c, cost: 3 };
  }
  const u = rollConsumable(rng, G, kind);
  return { id: uid('s'), kind: 'consumable', payload: u, cost: u.cost };
}

function jokerPrice(j) {
  const def = JOKER_BY_KEY[j.key];
  let cost = def.cost;
  if (j.edition === 'foil') cost += 2;
  if (j.edition === 'holo') cost += 3;
  if (j.edition === 'poly') cost += 5;
  if (j.edition === 'negative') cost += 5;
  return cost;
}

/** Apply Clearance/Liquidation and the Coupon tag to a sticker price. */
function discounted(G, cost) {
  if (G.shop?.coupon) return 0;
  let c = cost;
  if (G.vouchers.has('liquidation')) c = Math.ceil(c * 0.5);
  else if (G.vouchers.has('clearance')) c = Math.ceil(c * 0.75);
  return Math.max(0, c);
}

function rerollCost(G) {
  if (G.shop?.freeRerolls) return 0;
  const base = 5 + (G.shop?.rerolls ?? 0);
  let discount = 0;
  if (G.vouchers.has('reroll_surplus')) discount += 2;
  if (G.vouchers.has('reroll_glut')) discount += 2;
  return Math.max(0, base - discount);
}

function buildShop(rng, G, { keepVoucher = null } = {}) {
  const slots = G.derived.shopSlots;
  const items = [];
  for (let i = 0; i < slots; i++) items.push(rollShopItem(rng, G));

  const packs = [];
  for (let i = 0; i < 2; i++) {
    const def = rng.weighted(PACKS, (p) => p.weight);
    packs.push({ id: uid('p'), packKey: def.key, cost: def.cost });
  }

  // One voucher per ante; extra ones only come from the Voucher tag.
  let vouchers = keepVoucher ? [keepVoucher] : [];
  if (!vouchers.length) {
    const avail = availableVouchers(G.vouchers);
    if (avail.length) vouchers = [{ id: uid('v'), key: rng.pick(avail).key }];
  }

  return { items, packs, vouchers, rerolls: 0, coupon: false, freeRerolls: false, freebies: [] };
}

/** Contents of an opened booster pack. */
function openPack(rng, G, packKey) {
  const def = PACK_BY_KEY[packKey];
  const out = [];
  for (let i = 0; i < def.size; i++) {
    if (def.kind === 'joker') out.push({ id: uid('o'), kind: 'joker', payload: rollJoker(rng, G) });
    else if (def.kind === 'card') out.push({ id: uid('o'), kind: 'card', payload: rollPlayingCard(rng, G, { fancy: true }) });
    else if (def.kind === 'tarot') {
      const spectral = G.vouchers.has('omen_globe') && rng.chance(1, 8);
      out.push({ id: uid('o'), kind: 'consumable', payload: rollConsumable(rng, G, spectral ? 'spectral' : 'tarot') });
    } else if (def.kind === 'planet') {
      out.push({ id: uid('o'), kind: 'consumable', payload: rollConsumable(rng, G, 'planet') });
    } else {
      // Spectral packs carry a small chance of the two treasure cards.
      const key = rng.chance(1, 40) ? rng.pick(['soul', 'black_hole']) : rng.pick(SPECTRAL_KEYS);
      out.push({ id: uid('o'), kind: 'consumable', payload: makeConsumable(key) });
    }
  }

  // Telescope guarantees the Planet for whichever hand you play the most.
  if (def.kind === 'planet' && G.vouchers.has('telescope')) {
    let bestKey = 'high_card', best = -1;
    for (const [k, v] of Object.entries(G.handLevels)) if (v.plays > best) { best = v.plays; bestKey = k; }
    const wanted = PLANET_KEYS.find((pk) => CONSUMABLE_BY_KEY[pk].hand === bestKey);
    if (wanted && !out.some((o) => o.payload.key === wanted)) {
      out[0] = { id: uid('o'), kind: 'consumable', payload: makeConsumable(wanted) };
    }
  }

  return { packKey, choose: def.choose, picked: 0, options: out };
}

return { VOUCHERS, VOUCHER_BY_KEY, availableVouchers, PACKS, PACK_BY_KEY, rollJoker, rollConsumable, rollPlayingCard, jokerPrice, discounted, rerollCost, buildShop, openPack };
});

__def('game.js', function () {
// Run state, the scoring pipeline and every rules transition.
//
// The scoring pipeline is written as a pure-ish producer: it mutates run state
// (jokers gain counters, glass shatters) but also emits an ordered `events`
// list so the UI can replay the whole calculation one beat at a time.

const { makeRng, seedFromString, randomSeedString, clamp, uid } = __req('util.js');
const { standardDeck, baseChips, sellValue, byRank, SUIT_KEYS } = __req('cards.js');
const { evaluate, contains, handStats, freshHandLevels, HAND_BY_KEY } = __req('poker.js');
const { JOKER_BY_KEY, makeJoker, resolve: resolveJoker } = __req('jokers.js');
const { CONSUMABLE_BY_KEY, makeConsumable, randomEnhancedCard, NEEDS_HAND, TAROT_KEYS, PLANET_KEYS, SPECTRAL_KEYS } = __req('consumables.js');
const { BLIND_SLOTS, BOSS_BY_KEY, pickBoss, blindTarget, pickTag } = __req('blinds.js');
const { buildShop, openPack: rollPack, rollJoker, discounted, rerollCost, VOUCHER_BY_KEY, availableVouchers } = __req('shop.js');
const { DECK_BY_KEY } = __req('decks.js');

const SAVE_VERSION = 3;
const BASE_HANDS = 4;
const BASE_DISCARDS = 3;
const BASE_HAND_SIZE = 8;
const BASE_JOKER_SLOTS = 5;
const BASE_CONSUMABLE_SLOTS = 2;
const WIN_ANTE = 8;

// ------------------------------------------------------------- Run setup ----

function newRun({ seed = randomSeedString(), deckKey = 'standard' } = {}) {
  const rng = makeRng(seedFromString(seed));
  const deckDef = DECK_BY_KEY[deckKey] ?? DECK_BY_KEY.standard;
  const mods = deckDef.mods ?? {};

  const G = {
    version: SAVE_VERSION,
    seed,
    rngState: 0,
    deckKey,
    mods,

    ante: 1,
    blindIndex: 0,
    round: 0,
    phase: 'blind_select',

    money: 4 + (mods.money ?? 0),
    deck: (deckDef.build ? deckDef.build(rng) : standardDeck()),
    drawPile: [],
    hand: [],
    discardPile: [],
    playedZone: [],

    jokers: [],
    consumables: (mods.consumables ?? []).map((k) => makeConsumable(k)),
    vouchers: new Set(mods.vouchers ?? []),
    tags: [],

    handLevels: freshHandLevels(),
    selected: [],

    hands: 0,
    discards: 0,
    score: 0,
    target: 0,

    bossKey: null,
    bossesSeen: new Set(),
    bossRerolled: false,
    upcomingTags: [],

    handSizeMod: 0,
    roundHands: [],
    playedThisRound: new Set(),
    faceDown: false,
    forcedCardId: null,
    disabledJokerId: null,

    shop: null,
    pack: null,
    cashout: null,

    stats: {
      handsPlayed: 0, discardsUsed: 0, tarotsUsed: 0, planetsUsed: 0,
      cardsDiscarded: 0, bestHandScore: 0, bestHandName: '—',
      jokersOwned: 0, lastConsumable: null, mostPlayed: 'high_card',
    },
    log: [],
  };

  G.rngState = rng.state;
  recompute(G);
  rollUpcomingTags(G, rng);
  G.rngState = rng.state;
  return G;
}

/** The RNG state is stored as a plain integer so runs survive a reload intact. */
function withRng(G, fn) {
  const rng = makeRng(0);
  rng.state = G.rngState;
  const out = fn(rng);
  G.rngState = rng.state;
  return out;
}

// --------------------------------------------------------- Derived stats ----

/** Recomputed after every mutation; nothing else reads raw modifiers. */
function recompute(G) {
  const v = G.vouchers;
  const mods = G.mods ?? {};
  const boss = activeBoss(G);
  const bflags = boss?.flags ?? {};

  let handSize = BASE_HAND_SIZE + G.handSizeMod + (mods.handSize ?? 0);
  let hands = BASE_HANDS + (mods.hands ?? 0);
  let discards = BASE_DISCARDS + (mods.discards ?? 0);
  let jokerSlots = BASE_JOKER_SLOTS + (mods.jokerSlots ?? 0);
  let consumableSlots = BASE_CONSUMABLE_SLOTS + (mods.consumableSlots ?? 0);
  let extraInterest = 0;

  if (v.has('paint_brush')) handSize += 1;
  if (v.has('palette')) handSize += 1;
  if (v.has('grabber')) hands += 1;
  if (v.has('nacho_tong')) hands += 1;
  if (v.has('wasteful')) discards += 1;
  if (v.has('recyclomancy')) discards += 1;
  if (v.has('hieroglyph')) hands -= 1;
  if (v.has('petroglyph')) discards -= 1;
  if (v.has('antimatter')) jokerSlots += 1;
  if (v.has('crystal_ball')) consumableSlots += 1;

  for (const j of G.jokers) {
    const p = JOKER_BY_KEY[j.key]?.passive;
    if (!p) continue;
    handSize += p.handSize ?? 0;
    hands += p.hands ?? 0;
    discards += p.discards ?? 0;
    extraInterest += p.extraInterest ?? 0;
    consumableSlots += p.consumableSlots ?? 0;
  }
  // Negative jokers sit outside your slot limit.
  jokerSlots += G.jokers.filter((j) => j.edition === 'negative').length;

  if (bflags.handSize) handSize += bflags.handSize;
  if (G.juggleRounds > 0) handSize += 3;

  const honeLevel = v.has('glow_up') ? 4 : v.has('hone') ? 2 : 1;
  const interestCap = v.has('money_tree') ? 20 : v.has('seed_money') ? 10 : 5;

  G.derived = {
    handSize: Math.max(1, handSize),
    hands: Math.max(1, hands),
    discards: Math.max(0, discards),
    jokerSlots: Math.max(1, jokerSlots),
    consumableSlots: Math.max(0, consumableSlots),
    shopSlots: 2 + (v.has('overstock') ? 1 : 0) + (v.has('overstock_plus') ? 1 : 0),
    honeLevel,
    interestCap: mods.noInterest ? 0 : interestCap,
    extraInterest,
    tarotRate: v.has('tarot_tycoon') ? 4 : v.has('tarot_merchant') ? 2 : 1,
    planetRate: v.has('planet_tycoon') ? 4 : v.has('planet_merchant') ? 2 : 1,
    shopCards: v.has('magic_trick'),
  };
  return G.derived;
}

function activeBoss(G) {
  if (G.blindIndex !== 2 || !G.bossKey) return null;
  if (G.jokers.some((j) => JOKER_BY_KEY[j.key]?.rules?.noBoss)) return null;
  return BOSS_BY_KEY[G.bossKey];
}

/** Union of every passive rule change granted by the player's jokers. */
function activeRules(G) {
  const r = { fourFingers: false, shortcut: false, smeared: false, splash: false };
  for (const j of G.jokers) {
    const rules = JOKER_BY_KEY[j.key]?.rules;
    if (rules) Object.assign(r, rules);
  }
  return r;
}

function currentTarget(G) {
  const base = blindTarget(G.ante, G.blindIndex, G.blindIndex === 2 ? G.bossKey : null);
  return Math.round(base * (G.mods?.blindMult ?? 1));
}

// ------------------------------------------------------------ Blind flow ----

function rollUpcomingTags(G, rng) {
  G.upcomingTags = [pickTag(rng), pickTag(rng)];
}

function ensureBoss(G) {
  if (!G.bossKey) {
    withRng(G, (rng) => { G.bossKey = pickBoss(rng, G.ante, G.bossesSeen); });
  }
  return G.bossKey;
}

function rerollBoss(G) {
  if (!G.vouchers.has('directors_cut') || G.bossRerolled || G.money < 10) return false;
  G.money -= 10;
  G.bossRerolled = true;
  withRng(G, (rng) => { G.bossKey = pickBoss(rng, G.ante, G.bossesSeen); });
  return true;
}

function startBlind(G) {
  ensureBoss(G);
  const boss = activeBoss(G);
  const flags = boss?.flags ?? {};

  // Juggle tags are spent on the round they are carried into.
  const juggles = G.tags.filter((t) => t.key === 'juggle').length;
  if (juggles) {
    G.tags = G.tags.filter((t) => t.key !== 'juggle');
    G.juggleRounds = juggles;
  }

  recompute(G);
  G.phase = 'playing';
  G.round += 1;
  G.score = 0;
  G.target = currentTarget(G);
  G.hands = flags.handsOverride ?? G.derived.hands;
  G.discards = flags.discardsOverride ?? G.derived.discards;
  G.roundHands = [];
  G.playedThisRound = new Set();
  G.selected = [];
  G.playedZone = [];
  G.faceDown = !!flags.blindDraw;
  G.cashout = null;

  // Boss debuffs are stamped onto the cards themselves for the whole round.
  for (const c of G.deck) c.debuffed = boss?.debuff ? !!boss.debuff(c) : false;

  withRng(G, (rng) => {
    G.drawPile = rng.shuffle(G.deck.slice());
    G.discardPile = [];
    G.hand = [];
    fireJokers(G, 'onBlindStart', rng, {});
    drawUpTo(G, rng);
  });

  recompute(G);
  return G;
}

function canSkipBlind(G) {
  return G.phase === 'blind_select' && BLIND_SLOTS[G.blindIndex].skippable;
}

function skipBlind(G) {
  if (!canSkipBlind(G)) return null;
  const tagKey = G.upcomingTags[G.blindIndex];
  const result = grantTag(G, tagKey);
  G.stats.skips = (G.stats.skips ?? 0) + 1;
  G.blindIndex += 1;
  if (G.phase !== 'pack') G.phase = 'blind_select';
  return result;
}

function grantTag(G, tagKey) {
  const immediate = { charm: 'arcana_mega', meteor: 'celestial_mega', buffoon: 'buffoon_mega', ethereal: 'spectral', standard: 'standard_mega' };
  if (immediate[tagKey]) {
    withRng(G, (rng) => { G.pack = rollPack(rng, G, immediate[tagKey]); });
    G.pack.free = true;
    G.returnPhase = 'blind_select';
    G.phase = 'pack';
    return { tagKey, opened: true };
  }
  if (tagKey === 'handy') { G.money += G.stats.handsPlayed; return { tagKey, money: G.stats.handsPlayed }; }
  if (tagKey === 'garbage') {
    const n = Math.max(0, (G.stats.discardsAvailable ?? 0) - G.stats.discardsUsed);
    G.money += n;
    return { tagKey, money: n };
  }
  if (tagKey === 'economy') {
    const gain = Math.min(40, Math.max(0, G.money));
    G.money += gain;
    return { tagKey, money: gain };
  }
  G.tags.push({ id: uid('t'), key: tagKey });
  return { tagKey, held: true };
}

// ------------------------------------------------------------ Card flow -----

function drawUpTo(G, rng, limit = null) {
  const want = limit ?? G.derived.handSize;
  while (G.hand.length < want && G.drawPile.length) {
    const c = G.drawPile.pop();
    if (G.faceDown) c.faceDown = true;
    G.hand.push(c);
  }
  applyForcedCard(G, rng);
}

function applyForcedCard(G, rng) {
  const boss = activeBoss(G);
  if (!boss?.flags?.forceCard) { G.forcedCardId = null; return; }
  if (G.forcedCardId && G.hand.some((c) => c.id === G.forcedCardId)) return;
  G.forcedCardId = G.hand.length ? rng.pick(G.hand).id : null;
  if (G.forcedCardId && !G.selected.includes(G.forcedCardId)) G.selected.push(G.forcedCardId);
}

function toggleSelect(G, cardId) {
  if (G.phase !== 'playing') return;
  if (cardId === G.forcedCardId) return;
  const i = G.selected.indexOf(cardId);
  if (i >= 0) G.selected.splice(i, 1);
  else if (G.selected.length < 5) G.selected.push(cardId);
}

function selectedCards(G) {
  // Selection always scores in hand order, matching what the player sees.
  return G.hand.filter((c) => G.selected.includes(c.id));
}

function sortHand(G, mode) {
  const cmp = mode === 'suit'
    ? (a, b) => SUIT_KEYS.indexOf(a.suit) - SUIT_KEYS.indexOf(b.suit) || b.rank - a.rank
    : byRank;
  G.hand.sort(cmp);
  G.sortMode = mode;
}

function moveCard(G, cardId, toIndex) {
  const from = G.hand.findIndex((c) => c.id === cardId);
  if (from < 0) return;
  const [c] = G.hand.splice(from, 1);
  G.hand.splice(clamp(toIndex, 0, G.hand.length), 0, c);
}

// ----------------------------------------------------------- Play checks ----

function playBlocker(G) {
  const n = G.selected.length;
  if (!n) return 'Select up to 5 cards';
  if (G.hands <= 0) return 'No hands left';
  const boss = activeBoss(G);
  const flags = boss?.flags ?? {};
  if (flags.mustPlay && n !== flags.mustPlay) return `${boss.name}: play exactly ${flags.mustPlay} cards`;

  const cards = selectedCards(G);
  const key = evaluate(cards, activeRules(G)).key;
  if (flags.noRepeatHand && G.roundHands.includes(key)) return `${boss.name}: hand type already played`;
  if (flags.singleHandType && G.roundHands.length && G.roundHands[0] !== key) return `${boss.name}: only ${HAND_BY_KEY[G.roundHands[0]].name}`;
  return null;
}

function discardBlocker(G) {
  if (!G.selected.length) return 'Select cards to discard';
  if (G.discards <= 0) return 'No discards left';
  return null;
}

// -------------------------------------------------------------- Scoring -----

function jokerCtx(G, j, extra) {
  return {
    G, j,
    played: extra.played ?? [],
    scoring: extra.scoring ?? [],
    hand: extra.hand ?? [],
    handKey: extra.handKey,
    rng: extra.rng,
    contains: (what) => contains(extra.played ?? [], what, activeRules(G)),
  };
}

/** Run a non-scoring hook across every joker, honouring Blueprint copies. */
function fireJokers(G, hookName, rng, extra, arg) {
  const out = [];
  for (const j of G.jokers.slice()) {
    if (j.id === G.disabledJokerId) continue;
    const { def, host } = resolveJoker(G, j);
    const fn = def?.[hookName];
    if (typeof fn !== 'function') continue;
    const ctx = jokerCtx(G, host, { ...extra, rng });
    const res = fn(ctx, arg);
    if (res) out.push({ joker: j, res });
  }
  return out;
}

const EDITION_FX = { foil: { chips: 50 }, holo: { mult: 10 }, poly: { xmult: 1.5 } };
const ZERO = () => ({ chips: 0, mult: 0, xmult: 1, money: 0 });

/**
 * Score the currently selected cards.
 * Returns { events, total, handKey, handName, level, chips, mult, moneyGained }.
 */
function scoreSelected(G) {
  const rng = makeRng(0);
  rng.state = G.rngState;

  const rules = activeRules(G);
  const played = selectedCards(G);
  const boss = activeBoss(G);
  const flags = boss?.flags ?? {};

  // Crimson Heart switches one joker off for the duration of this hand.
  G.disabledJokerId = null;
  if (flags.disableJoker && G.jokers.length) G.disabledJokerId = rng.pick(G.jokers).id;

  const ev = evaluate(played, rules);
  const handKey = ev.key;
  let scoring = rules.splash ? played.slice() : ev.scoring;

  G.roundHands.push(handKey);
  G.handLevels[handKey].plays += 1;
  if (flags.downgrade) G.handLevels[handKey].level = Math.max(1, G.handLevels[handKey].level - 1);

  const stats = handStats(handKey, G.handLevels);
  let chips = stats.chips;
  let mult = stats.mult;
  if (flags.halveBase) { chips = Math.floor(chips / 2); mult = Math.max(1, Math.floor(mult / 2)); }

  const events = [];
  let moneyGained = 0;
  const sideEffects = { destroy: [], createTarot: 0, clone: [], levelUp: 0 };
  const held = G.hand.filter((c) => !G.selected.includes(c.id));

  // `d` is the delta this beat contributed; `chips`/`mult` are running totals.
  const push = (kind, refId, d, text) => {
    events.push({ kind, refId, d, text: text ?? '', chips, mult });
  };
  const applyDelta = (d) => {
    chips += d.chips;
    mult += d.mult;
    mult *= d.xmult;
    moneyGained += d.money;
  };
  const apply = (res, kind, refId) => {
    if (!res) return;
    const d = { chips: res.chips ?? 0, mult: res.mult ?? 0, xmult: res.xmult ?? 1, money: res.money ?? 0 };
    applyDelta(d);
    if (res.createTarot) sideEffects.createTarot += res.createTarot;
    if (res.levelUpHand) sideEffects.levelUp += res.levelUpHand;
    if (res.cloneCard) sideEffects.clone.push(res.cloneCard);
    if (res.destroySelf) sideEffects.destroy.push(res.destroySelf === true ? refId : res.destroySelf);
    const visible = d.chips || d.mult || d.xmult !== 1 || d.money || res.msg;
    if (visible) push(kind, refId, d, res.msg);
  };

  events.push({ kind: 'base', refId: null, d: ZERO(), text: `${ev.name} · Lv.${stats.level}`, chips, mult });

  // Pre-scoring joker hooks (Midas, Vampire, DNA, Astronomer, counters…).
  const base = { played, scoring, hand: held, handKey, rng };
  for (const { joker, res } of fireJokers(G, 'onPlay', rng, base)) apply(res, 'joker', joker.id);

  const countRetriggers = (hookName, card) => {
    let n = 0;
    for (const j of G.jokers) {
      if (j.id === G.disabledJokerId) continue;
      const { def, host } = resolveJoker(G, j);
      n += def?.[hookName]?.(jokerCtx(G, host, base), card) ?? 0;
    }
    return n;
  };
  const runCardHook = (hookName, card) => {
    for (const j of G.jokers) {
      if (j.id === G.disabledJokerId) continue;
      const { def, host } = resolveJoker(G, j);
      if (typeof def?.[hookName] !== 'function') continue;
      apply(def[hookName](jokerCtx(G, host, base), card), 'joker', j.id);
    }
  };

  // --- scoring cards, left to right -----------------------------------------
  for (const card of scoring) {
    if (card.debuffed) { push('card', card.id, ZERO(), 'debuffed'); continue; }

    const triggers = 1 + (card.seal === 'red' ? 1 : 0) + countRetriggers('retrigger', card);

    for (let t = 0; t < triggers; t++) {
      const d = ZERO();
      d.chips += baseChips(card);
      switch (card.enhancement) {
        case 'bonus': d.chips += 30; break;
        case 'mult': d.mult += 4; break;
        case 'glass': d.xmult *= 2; break;
        case 'lucky':
          if (rng.chance(1, 5)) d.mult += 20;
          if (rng.chance(1, 15)) d.money += 20;
          break;
        default: break;
      }
      const ed = EDITION_FX[card.edition];
      if (ed) { d.chips += ed.chips ?? 0; d.mult += ed.mult ?? 0; d.xmult *= ed.xmult ?? 1; }
      if (card.seal === 'gold') d.money += 3;

      applyDelta(d);
      push('card', card.id, d, t > 0 ? 'again!' : null);
      runCardHook('scored', card);
    }

    if (card.enhancement === 'glass' && rng.chance(1, 4)) sideEffects.destroy.push(card.id);
  }

  // --- cards held in hand ---------------------------------------------------
  for (const card of held) {
    if (card.debuffed) continue;
    const triggers = 1 + (card.seal === 'red' ? 1 : 0) + countRetriggers('retriggerHeld', card);
    for (let t = 0; t < triggers; t++) {
      if (card.enhancement === 'steel') {
        const d = { ...ZERO(), xmult: 1.5 };
        applyDelta(d);
        push('held', card.id, d, null);
      }
      runCardHook('held', card);
    }
  }

  // --- independent joker effects, left to right -----------------------------
  for (const j of G.jokers) {
    if (j.id === G.disabledJokerId) { push('joker', j.id, ZERO(), 'disabled'); continue; }
    const { def, host } = resolveJoker(G, j);
    if (typeof def?.ind === 'function') apply(def.ind(jokerCtx(G, host, base)), 'joker', j.id);
    const ed = EDITION_FX[j.edition];
    if (ed) {
      const d = { ...ZERO(), ...ed, xmult: ed.xmult ?? 1 };
      applyDelta(d);
      push('joker', j.id, d, j.edition);
    }
  }

  // Observatory pays out for Planet cards you are still holding.
  if (G.vouchers.has('observatory')) {
    for (const u of G.consumables) {
      const def = CONSUMABLE_BY_KEY[u.key];
      if (def?.type === 'planet' && def.hand === handKey) {
        const d = { ...ZERO(), xmult: 1.5 };
        applyDelta(d);
        push('voucher', u.id, d, 'Observatory');
      }
    }
  }

  if (G.mods?.plasma) {
    const avg = (chips + mult) / 2;
    chips = avg; mult = avg;
    push('deck', null, ZERO(), 'Balanced');
  }

  const total = Math.round(chips * mult);
  events.push({ kind: 'total', refId: null, d: ZERO(), text: '', chips, mult, total });

  G.rngState = rng.state;
  return { events, total, handKey, handName: ev.name, level: stats.level, chips, mult, moneyGained, sideEffects, scoring, played };
}

/** Commit a scored hand: move cards, pay out, apply side effects, refill. */
function commitHand(G, result) {
  const boss = activeBoss(G);
  const flags = boss?.flags ?? {};

  G.score += result.total;
  G.hands -= 1;
  G.stats.handsPlayed += 1;
  if (result.total > G.stats.bestHandScore) {
    G.stats.bestHandScore = result.total;
    G.stats.bestHandName = result.handName;
  }

  if (result.moneyGained) G.money += result.moneyGained;
  if (flags.costPerCard) G.money -= flags.costPerCard * result.played.length;
  if (flags.oxPenalty && result.handKey === mostPlayedHand(G)) G.money = 0;
  G.money = Math.max(-20, G.money);

  withRng(G, (rng) => {
    // Destroy anything that shattered or self-destructed during scoring.
    for (const id of result.sideEffects.destroy) {
      const card = G.deck.find((c) => c.id === id);
      if (card) destroyCard(G, card, rng);
      const joker = G.jokers.find((j) => j.id === id);
      if (joker) removeJoker(G, joker);
    }
    for (let i = 0; i < result.sideEffects.createTarot; i++) addConsumable(G, makeConsumable(rng.pick(TAROT_KEYS)));
    for (const src of result.sideEffects.clone) {
      const copy = { ...src, id: uid('c') };
      G.deck.push(copy);
      G.hand.push(copy);
      fireJokers(G, 'onCardAdded', rng, {}, copy);
    }
    if (result.sideEffects.levelUp) levelHand(G, result.handKey, result.sideEffects.levelUp);

    // Played cards leave the hand.
    const playedIds = new Set(result.played.map((c) => c.id));
    G.hand = G.hand.filter((c) => !playedIds.has(c.id));
    for (const c of result.played) {
      if (G.deck.includes(c)) G.discardPile.push(c);
      if (flags.pillar) c.debuffed = true;
      G.playedThisRound.add(c.id);
    }

    G.selected = [];
    G.playedZone = result.played;
    if (G.faceDown) { G.faceDown = false; for (const c of G.deck) c.faceDown = false; }

    // The Hook eats two more cards after every hand.
    if (flags.discardAfterPlay && G.hand.length) {
      const doomed = rng.shuffle(G.hand.slice()).slice(0, flags.discardAfterPlay);
      G.hand = G.hand.filter((c) => !doomed.includes(c));
      G.discardPile.push(...doomed);
    }

    if (G.score < G.target && G.hands > 0) {
      drawUpTo(G, rng, flags.drawFixed ? G.hand.length + flags.drawFixed : null);
    }
  });

  if (G.score >= G.target) finishBlind(G);
  else if (G.hands <= 0) G.phase = 'game_over';

  recompute(G);
  return G;
}

function discardSelected(G) {
  if (discardBlocker(G)) return null;
  const cards = selectedCards(G);
  const flags = activeBoss(G)?.flags ?? {};

  G.discards -= 1;
  G.stats.discardsUsed += 1;
  G.stats.cardsDiscarded += cards.length;

  withRng(G, (rng) => {
    for (const { res } of fireJokers(G, 'onDiscard', rng, { hand: G.hand, rng }, cards)) {
      if (res?.money) G.money += res.money;
    }
    // Purple seals turn discards into Tarot cards.
    for (const c of cards) if (c.seal === 'purple') addConsumable(G, makeConsumable(rng.pick(TAROT_KEYS)));

    const ids = new Set(cards.map((c) => c.id));
    G.hand = G.hand.filter((c) => !ids.has(c.id));
    G.discardPile.push(...cards);
    G.selected = [];
    drawUpTo(G, rng, flags.drawFixed ? G.hand.length + flags.drawFixed : null);
  });

  recompute(G);
  return cards;
}

function mostPlayedHand(G) {
  let key = 'high_card', best = -1;
  for (const [k, v] of Object.entries(G.handLevels)) if (v.plays > best) { best = v.plays; key = k; }
  return key;
}

// ------------------------------------------------------------ Round end -----

function finishBlind(G) {
  const slot = BLIND_SLOTS[G.blindIndex];
  const lines = [];
  let total = 0;

  const add = (label, amount) => { if (amount) { lines.push({ label, amount }); total += amount; } };

  add(`${slot.name} reward`, slot.reward);
  add(`${G.hands} hand${G.hands === 1 ? '' : 's'} remaining`, G.hands * (G.mods?.handCash ?? 1));
  if (G.mods?.discardCash) add(`${G.discards} discards remaining`, G.discards * G.mods.discardCash);

  const cap = G.derived.interestCap;
  if (cap > 0 && G.money > 0) {
    const rate = 1 + G.derived.extraInterest;
    add('Interest', Math.min(cap, Math.floor(G.money / 5) * rate));
  }

  withRng(G, (rng) => {
    const goldHeld = G.hand.filter((c) => c.enhancement === 'gold').length;
    add('Gold cards held', goldHeld * 3);

    for (const c of G.hand) if (c.seal === 'blue') addConsumable(G, makeConsumable(rng.pick(PLANET_KEYS)));

    for (const { joker, res } of fireJokers(G, 'onRoundEnd', rng, { hand: G.hand, rng })) {
      if (res?.money) add(JOKER_BY_KEY[joker.key].name, res.money);
      if (res?.destroySelf) {
        removeJoker(G, joker);
        if (res.spawn && G.jokers.length < G.derived.jokerSlots) G.jokers.push(makeJoker(res.spawn));
      }
    }

    // Investment tags mature once a Boss Blind falls.
    if (G.blindIndex === 2) {
      const invest = G.tags.filter((t) => t.key === 'investment');
      if (invest.length) {
        add('Investment Tag', 25 * invest.length);
        G.tags = G.tags.filter((t) => t.key !== 'investment');
      }
      if (G.mods?.bossTag) G.tags.push({ id: uid('t'), key: pickTag(rng) });
    }
  });

  G.money += total;
  G.cashout = { lines, total, blindName: slot.name };
  G.phase = 'round_end';
  G.bossesSeen.add(G.bossKey);
  G.juggleRounds = Math.max(0, (G.juggleRounds ?? 0) - 1);
  G.stats.discardsAvailable = (G.stats.discardsAvailable ?? 0) + G.derived.discards;
  G.stats.mostPlayed = mostPlayedHand(G);
  return G.cashout;
}

/** Cash-out screen dismissed — advance the blind and open the shop. */
function leaveCashout(G) {
  const wasBoss = G.blindIndex === 2;
  if (wasBoss) {
    if (G.ante >= WIN_ANTE && !G.won) { G.won = true; G.phase = 'win'; return G; }
    G.ante += 1;
    G.blindIndex = 0;
    G.bossKey = null;
    G.bossRerolled = false;
    withRng(G, (rng) => rollUpcomingTags(G, rng));
  } else {
    G.blindIndex += 1;
  }
  enterShop(G);
  return G;
}

function continueEndless(G) {
  G.ante += 1;
  G.blindIndex = 0;
  G.bossKey = null;
  G.bossRerolled = false;
  withRng(G, (rng) => rollUpcomingTags(G, rng));
  enterShop(G);
  return G;
}

// ----------------------------------------------------------------- Shop -----

function enterShop(G) {
  recompute(G);
  withRng(G, (rng) => { G.shop = buildShop(rng, G); });

  // Cash in the shop-modifying tags the player is holding.
  const consume = (key) => {
    const i = G.tags.findIndex((t) => t.key === key);
    if (i < 0) return false;
    G.tags.splice(i, 1);
    return true;
  };
  if (consume('coupon')) G.shop.coupon = true;
  if (consume('d6')) G.shop.freeRerolls = true;
  if (consume('voucher')) {
    withRng(G, (rng) => {
      const taken = new Set(G.shop.vouchers.map((v) => v.key));
      const pool = availableVouchers(G.vouchers).filter((v) => !taken.has(v.key));
      if (pool.length) G.shop.vouchers.push({ id: uid('v'), key: rng.pick(pool).key });
    });
  }
  for (const rarity of [['uncommon', 2], ['rare', 3]]) {
    if (consume(rarity[0])) {
      withRng(G, (rng) => {
        const j = rollJoker(rng, G, { forceRarity: rarity[1] });
        G.shop.items.unshift({ id: uid('s'), kind: 'joker', payload: j, cost: 0, free: true });
      });
    }
  }

  G.phase = 'shop';
  return G;
}

function rerollShop(G) {
  const cost = rerollCost(G);
  if (G.money < cost) return false;
  G.money -= cost;
  const rerolls = G.shop.rerolls + 1;
  const keepVoucher = G.shop.vouchers[0] ?? null;
  const coupon = G.shop.coupon, freeRerolls = G.shop.freeRerolls;
  withRng(G, (rng) => { G.shop = buildShop(rng, G, { keepVoucher }); });
  Object.assign(G.shop, { rerolls, coupon, freeRerolls });
  return true;
}

function itemPrice(G, item) {
  return item.free ? 0 : discounted(G, item.cost);
}

function buyItem(G, itemId) {
  const idx = G.shop.items.findIndex((i) => i.id === itemId);
  if (idx < 0) return { ok: false, msg: 'Gone' };
  const item = G.shop.items[idx];
  const price = itemPrice(G, item);
  if (G.money < price) return { ok: false, msg: 'Not enough money' };

  if (item.kind === 'joker') {
    if (!hasJokerRoom(G, item.payload)) return { ok: false, msg: 'No Joker slots' };
    G.money -= price;
    G.jokers.push(item.payload);
    G.stats.jokersOwned += 1;
  } else if (item.kind === 'consumable') {
    if (G.consumables.length >= G.derived.consumableSlots) return { ok: false, msg: 'No consumable slots' };
    G.money -= price;
    G.consumables.push(item.payload);
  } else {
    G.money -= price;
    G.deck.push(item.payload);
    withRng(G, (rng) => fireJokers(G, 'onCardAdded', rng, {}, item.payload));
  }

  G.shop.items.splice(idx, 1);
  recompute(G);
  return { ok: true };
}

function hasJokerRoom(G, joker) {
  if (joker?.edition === 'negative') return true;
  return G.jokers.length < G.derived.jokerSlots;
}

function buyVoucher(G, voucherId) {
  const idx = G.shop.vouchers.findIndex((v) => v.id === voucherId);
  if (idx < 0) return { ok: false, msg: 'Gone' };
  const v = G.shop.vouchers[idx];
  const price = discounted(G, VOUCHER_BY_KEY[v.key]?.cost ?? 10);
  if (G.money < price) return { ok: false, msg: 'Not enough money' };
  G.money -= price;
  G.vouchers.add(v.key);
  G.shop.vouchers.splice(idx, 1);

  // Hieroglyph and Petroglyph literally roll the run back an ante.
  if (v.key === 'hieroglyph' || v.key === 'petroglyph') G.ante = Math.max(1, G.ante - 1);
  recompute(G);
  return { ok: true };
}

function buyPack(G, packId) {
  const idx = G.shop.packs.findIndex((p) => p.id === packId);
  if (idx < 0) return { ok: false, msg: 'Gone' };
  const p = G.shop.packs[idx];
  const price = discounted(G, p.cost);
  if (G.money < price) return { ok: false, msg: 'Not enough money' };
  G.money -= price;
  G.shop.packs.splice(idx, 1);
  withRng(G, (rng) => { G.pack = rollPack(rng, G, p.packKey); });
  G.returnPhase = 'shop';
  G.phase = 'pack';
  return { ok: true };
}

function leaveShop(G) {
  withRng(G, (rng) => {
    for (const { res } of fireJokers(G, 'onShopExit', rng, {})) {
      if (res?.negativeCopy && G.consumables.length) {
        const src = rng.pick(G.consumables);
        addConsumable(G, { ...makeConsumable(src.key), edition: 'negative' }, true);
      }
    }
  });
  G.shop = null;
  G.phase = 'blind_select';
  recompute(G);
  return G;
}

// ---------------------------------------------------------------- Packs -----

function pickFromPack(G, optionId) {
  const pack = G.pack;
  if (!pack) return { ok: false };
  const idx = pack.options.findIndex((o) => o.id === optionId);
  if (idx < 0) return { ok: false };
  const opt = pack.options[idx];

  if (opt.kind === 'joker') {
    if (!hasJokerRoom(G, opt.payload)) return { ok: false, msg: 'No Joker slots' };
    G.jokers.push(opt.payload);
  } else if (opt.kind === 'consumable') {
    if (G.consumables.length >= G.derived.consumableSlots) {
      // Slots are full, so the card has to be used on the spot. That is only
      // possible when it needs no target — otherwise there is nowhere to put it.
      const blocked = consumableBlocker(G, opt.payload);
      if (blocked) return { ok: false, msg: 'No consumable slots' };
      const used = useConsumableObject(G, opt.payload, []);
      if (used.ok === false) return { ok: false, msg: used.msg ?? 'No consumable slots' };
    } else {
      G.consumables.push(opt.payload);
    }
  } else {
    G.deck.push(opt.payload);
    withRng(G, (rng) => fireJokers(G, 'onCardAdded', rng, {}, opt.payload));
  }

  pack.options.splice(idx, 1);
  pack.picked += 1;
  recompute(G);
  if (pack.picked >= pack.choose || !pack.options.length) closePack(G);
  return { ok: true };
}

function closePack(G) {
  G.pack = null;
  G.phase = G.returnPhase ?? 'shop';
  G.returnPhase = null;
  if (G.phase === 'shop' && !G.shop) enterShop(G);
  recompute(G);
  return G;
}

// ----------------------------------------------------- Jokers & consumables --

function sellJoker(G, jokerId) {
  const j = G.jokers.find((x) => x.id === jokerId);
  if (!j) return false;
  const value = sellValue(j.cost);

  withRng(G, (rng) => {
    const { def, host } = resolveJoker(G, j);
    const res = def?.onSellSelf?.(jokerCtx(G, host, { rng }));
    if (res?.duplicateJoker) {
      const others = G.jokers.filter((x) => x !== j);
      if (others.length && G.jokers.length <= G.derived.jokerSlots) {
        const src = rng.pick(others);
        G.jokers.push({ ...makeJoker(src.key, src.edition), state: { ...src.state } });
      }
    }
    removeJoker(G, j);
    fireJokers(G, 'onSellOther', rng, {});
  });

  G.money += value;
  recompute(G);
  return true;
}

function sellConsumable(G, id) {
  const i = G.consumables.findIndex((c) => c.id === id);
  if (i < 0) return false;
  const [u] = G.consumables.splice(i, 1);
  G.money += Math.max(1, Math.floor(u.cost / 2));
  withRng(G, (rng) => fireJokers(G, 'onSellOther', rng, {}));
  recompute(G);
  return true;
}

function moveJoker(G, jokerId, toIndex) {
  const from = G.jokers.findIndex((j) => j.id === jokerId);
  if (from < 0) return;
  const [j] = G.jokers.splice(from, 1);
  G.jokers.splice(clamp(toIndex, 0, G.jokers.length), 0, j);
}

function removeJoker(G, j) {
  const i = G.jokers.indexOf(j);
  if (i >= 0) G.jokers.splice(i, 1);
}

function addConsumable(G, item, force = false) {
  if (!force && G.consumables.length >= G.derived.consumableSlots) return false;
  G.consumables.push(item);
  return true;
}

function consumableBlocker(G, item) {
  const def = CONSUMABLE_BY_KEY[item.key];
  const need = def.sel;
  const wantsHand = (need && need.max > 0) || NEEDS_HAND.has(item.key);
  if (wantsHand && G.phase !== 'playing') return 'Only usable during a blind';
  if (!need || need.max === 0) return null;
  const n = G.selected.length;
  if (n < need.min) return `Select ${need.min === need.max ? need.min : `${need.min}-${need.max}`} card${need.max > 1 ? 's' : ''}`;
  if (n > need.max) return `Select at most ${need.max}`;
  return null;
}

function useConsumable(G, id) {
  const i = G.consumables.findIndex((c) => c.id === id);
  if (i < 0) return { ok: false };
  const item = G.consumables[i];
  const sel = selectedCards(G);
  const out = useConsumableObject(G, item, sel);
  if (out.ok !== false) {
    G.consumables.splice(i, 1);
    G.selected = [];
  }
  return out;
}

function useConsumableObject(G, item, sel) {
  const def = CONSUMABLE_BY_KEY[item.key];
  if (!def) return { ok: false };
  // Guard the apply() functions: several index straight into `sel`.
  if (def.sel && sel.length < def.sel.min) return { ok: false, msg: 'Select a target card first' };

  let out = { ok: true };
  withRng(G, (rng) => {
    const api = makeApi(G, rng);
    const res = def.apply(G, sel, api) ?? {};
    if (res.ok === false) { out = res; return; }
    out = { ok: true, msg: res.msg ?? def.name };

    G.stats.lastConsumable = item.key;
    if (def.type === 'tarot') G.stats.tarotsUsed += 1;
    if (def.type === 'planet') { G.stats.planetsUsed += 1; fireJokers(G, 'onPlanetUsed', rng, {}); }
  });
  recompute(G);
  return out;
}

/** The surface consumables use to touch the run without importing game.js. */
function makeApi(G, rng) {
  return {
    rng,
    addMoney: (n) => { G.money += n; },
    setMoney: (n) => { G.money = n; },
    levelHand: (key, n) => levelHand(G, key, n),
    destroyCard: (c) => destroyCard(G, c, rng),
    destroyRandomInHand: (n) => {
      const pool = rng.shuffle(G.hand.slice()).slice(0, n);
      for (const c of pool) destroyCard(G, c, rng);
    },
    addCard: (c) => {
      const card = c.id && !G.deck.some((x) => x.id === c.id) ? c : { ...c, id: uid('c') };
      G.deck.push(card);
      if (G.phase === 'playing' && G.hand.length < G.derived.handSize) G.hand.push(card);
      fireJokers(G, 'onCardAdded', rng, {}, card);
      return card;
    },
    addRandomCard: (opts) => {
      const card = randomEnhancedCard(rng, opts);
      G.deck.push(card);
      if (G.phase === 'playing' && G.hand.length < G.derived.handSize) G.hand.push(card);
      fireJokers(G, 'onCardAdded', rng, {}, card);
      return card;
    },
    createConsumableKey: (key) => addConsumable(G, makeConsumable(key)),
    createRandom: (type, n) => {
      const keys = type === 'planet' ? PLANET_KEYS : type === 'spectral' ? SPECTRAL_KEYS : TAROT_KEYS;
      for (let i = 0; i < n; i++) addConsumable(G, makeConsumable(rng.pick(keys)));
    },
    createJoker: (rarity = null) => {
      if (G.jokers.length >= G.derived.jokerSlots) return null;
      const j = rollJoker(rng, G, { forceRarity: rarity });
      G.jokers.push(j);
      return j;
    },
    copyJoker: (src) => {
      if (G.jokers.length >= G.derived.jokerSlots + 1) return null;
      return { ...makeJoker(src.key, src.edition), state: { ...src.state } };
    },
  };
}

function levelHand(G, key, n = 1) {
  G.handLevels[key].level = Math.max(1, G.handLevels[key].level + n);
  return G.handLevels[key].level;
}

function destroyCard(G, card, rng) {
  const i = G.deck.indexOf(card);
  if (i >= 0) G.deck.splice(i, 1);
  G.hand = G.hand.filter((c) => c !== card);
  G.drawPile = G.drawPile.filter((c) => c !== card);
  G.discardPile = G.discardPile.filter((c) => c !== card);
  fireJokers(G, 'onDestroy', rng ?? makeRng(G.rngState), {}, card);
}

// ------------------------------------------------------------ Save / load ---

function serialize(G) {
  return JSON.stringify({
    ...G,
    vouchers: [...G.vouchers],
    bossesSeen: [...G.bossesSeen],
    playedThisRound: [...G.playedThisRound],
    derived: undefined,
    mods: undefined,
  });
}

function deserialize(raw) {
  const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
  if (!o || o.version !== SAVE_VERSION) return null;
  const G = {
    ...o,
    vouchers: new Set(o.vouchers ?? []),
    bossesSeen: new Set(o.bossesSeen ?? []),
    playedThisRound: new Set(o.playedThisRound ?? []),
    mods: DECK_BY_KEY[o.deckKey]?.mods ?? {},
  };
  // Rebuild object identity between the deck and the per-round piles.
  const byId = new Map(G.deck.map((c) => [c.id, c]));
  const relink = (arr) => (arr ?? []).map((c) => byId.get(c.id) ?? c);
  G.drawPile = relink(G.drawPile);
  G.hand = relink(G.hand);
  G.discardPile = relink(G.discardPile);
  G.playedZone = relink(G.playedZone);
  recompute(G);
  return G;
}

return { SAVE_VERSION, WIN_ANTE, newRun, recompute, activeBoss, activeRules, currentTarget, ensureBoss, rerollBoss, startBlind, canSkipBlind, skipBlind, toggleSelect, selectedCards, sortHand, moveCard, playBlocker, discardBlocker, scoreSelected, commitHand, discardSelected, leaveCashout, continueEndless, enterShop, rerollShop, itemPrice, buyItem, hasJokerRoom, buyVoucher, buyPack, leaveShop, pickFromPack, closePack, sellJoker, sellConsumable, moveJoker, addConsumable, consumableBlocker, useConsumable, levelHand, destroyCard, serialize, deserialize };
});

__def('audio.js', function () {
// Tiny WebAudio synth. No asset files, so the whole game stays offline-safe.

let ctx = null;
let enabled = true;
let master = null;

function ensure() {
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  ctx = new AC();
  master = ctx.createGain();
  master.gain.value = 0.28;
  master.connect(ctx.destination);
  return ctx;
}

/** iOS keeps the context suspended until a user gesture resumes it. */
function unlock() {
  const c = ensure();
  if (c && c.state === 'suspended') c.resume();
}

function setEnabled(v) { enabled = v; }
function isEnabled() { return enabled; }

function tone({ freq = 440, dur = 0.09, type = 'triangle', vol = 0.5, slide = 0, delay = 0 }) {
  if (!enabled) return;
  const c = ensure();
  if (!c) return;
  const t0 = c.currentTime + delay;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function noise({ dur = 0.12, vol = 0.25, delay = 0, hp = 800 }) {
  if (!enabled) return;
  const c = ensure();
  if (!c) return;
  const t0 = c.currentTime + delay;
  const frames = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, frames, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
  const src = c.createBufferSource();
  src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = hp;
  const gain = c.createGain();
  gain.gain.value = vol;
  src.connect(filter).connect(gain).connect(master);
  src.start(t0);
}

const sfx = {
  tap: () => tone({ freq: 620, dur: 0.04, type: 'square', vol: 0.16 }),
  select: () => tone({ freq: 880, dur: 0.05, type: 'triangle', vol: 0.2 }),
  deselect: () => tone({ freq: 500, dur: 0.05, type: 'triangle', vol: 0.15 }),
  deal: () => noise({ dur: 0.07, vol: 0.14, hp: 2400 }),
  /** Rising pitch as the scoring chain builds. */
  chip: (i = 0) => tone({ freq: 480 + Math.min(i, 22) * 34, dur: 0.06, type: 'square', vol: 0.2 }),
  mult: (i = 0) => tone({ freq: 300 + Math.min(i, 18) * 26, dur: 0.09, type: 'sawtooth', vol: 0.18 }),
  xmult: () => { tone({ freq: 300, dur: 0.16, type: 'sawtooth', vol: 0.24, slide: 500 }); noise({ dur: 0.16, vol: 0.12, hp: 500 }); },
  money: () => { tone({ freq: 1050, dur: 0.06, type: 'sine', vol: 0.24 }); tone({ freq: 1500, dur: 0.09, type: 'sine', vol: 0.2, delay: 0.05 }); },
  discard: () => noise({ dur: 0.16, vol: 0.2, hp: 900 }),
  win: () => [0, 0.1, 0.2, 0.34].forEach((d, i) => tone({ freq: [523, 659, 784, 1047][i], dur: 0.22, type: 'triangle', vol: 0.3, delay: d })),
  lose: () => [0, 0.13, 0.28].forEach((d, i) => tone({ freq: [392, 330, 233][i], dur: 0.34, type: 'sawtooth', vol: 0.26, delay: d })),
  boss: () => { tone({ freq: 110, dur: 0.5, type: 'sawtooth', vol: 0.3 }); noise({ dur: 0.4, vol: 0.16, hp: 200 }); },
  buy: () => { tone({ freq: 780, dur: 0.06, type: 'square', vol: 0.2 }); tone({ freq: 1180, dur: 0.08, type: 'square', vol: 0.18, delay: 0.05 }); },
  error: () => tone({ freq: 180, dur: 0.14, type: 'square', vol: 0.2 }),
  pack: () => { noise({ dur: 0.25, vol: 0.24, hp: 400 }); tone({ freq: 700, dur: 0.2, type: 'triangle', vol: 0.22, slide: 400 }); },
};

/** Haptics where the platform offers them; silently ignored elsewhere. */
let haptics = true;
function setHaptics(v) { haptics = v; }
function isHaptics() { return haptics; }
function buzz(ms = 8) {
  if (haptics && navigator.vibrate) { try { navigator.vibrate(ms); } catch { /* unsupported */ } }
}

return { unlock, setEnabled, isEnabled, sfx, setHaptics, isHaptics, buzz };
});

__def('save.js', function () {
// localStorage persistence: the in-progress run, settings and lifetime stats.

const { serialize, deserialize } = __req('game.js');

const RUN_KEY = 'jokerdeck.run.v3';
const SETTINGS_KEY = 'jokerdeck.settings.v1';
const PROFILE_KEY = 'jokerdeck.profile.v1';

const read = (key, fallback) => {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
};
const write = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* quota or private mode */ }
};

function saveRun(G) {
  try { localStorage.setItem(RUN_KEY, serialize(G)); } catch { /* ignore */ }
}

function loadRun() {
  try {
    const raw = localStorage.getItem(RUN_KEY);
    return raw ? deserialize(raw) : null;
  } catch { return null; }
}

function clearRun() {
  try { localStorage.removeItem(RUN_KEY); } catch { /* ignore */ }
}

function hasRun() {
  try { return !!localStorage.getItem(RUN_KEY); } catch { return false; }
}

const defaultSettings = { sound: true, haptics: true, fastScoring: false, confirmDiscard: false };
const loadSettings = () => ({ ...defaultSettings, ...read(SETTINGS_KEY, {}) });
const saveSettings = (s) => write(SETTINGS_KEY, s);

const defaultProfile = {
  runs: 0, wins: 0, bestAnte: 0, bestScore: 0, bestHandScore: 0,
  handsPlayed: 0, decksWon: [],
};
const loadProfile = () => ({ ...defaultProfile, ...read(PROFILE_KEY, {}) });
const saveProfile = (p) => write(PROFILE_KEY, p);

/** Fold a finished run into the lifetime profile. */
function recordRun(G, won) {
  const p = loadProfile();
  p.runs += 1;
  if (won) {
    p.wins += 1;
    if (!p.decksWon.includes(G.deckKey)) p.decksWon.push(G.deckKey);
  }
  p.bestAnte = Math.max(p.bestAnte, G.ante);
  p.bestScore = Math.max(p.bestScore, G.score);
  p.bestHandScore = Math.max(p.bestHandScore, G.stats.bestHandScore);
  p.handsPlayed += G.stats.handsPlayed;
  saveProfile(p);
  return p;
}

return { saveRun, loadRun, clearRun, hasRun, defaultSettings, loadSettings, saveSettings, defaultProfile, loadProfile, saveProfile, recordRun };
});

  'app', 'topbar', 'blind-chip', 'scoreline', 'score-value', 'score-fill',
  'jokers', 'consumables', 'played', 'calc', 'calc-chips', 'calc-mult', 'hand-name',
  'hud-hands', 'hud-discards', 'hud-money', 'hud-ante', 'hud-round',
  'hand', 'btn-play', 'btn-discard', 'btn-sort-rank', 'btn-sort-suit',
  'btn-menu', 'btn-info', 'overlay', 'fx', 'toast', 'tip', 'deck-count',
];

let G = null;
let settings = Save.defaultSettings;
let busy = false;          // true while a scoring animation is running
let screen = 'menu';       // 'menu' | 'game'

// -------------------------------------------------------------------- boot --

function boot() {
  for (const id of ids) dom[id.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = document.getElementById(id);
  settings = Save.loadSettings();
  setEnabled(settings.sound);
  setHaptics(settings.haptics);
  wireControls();
  window.addEventListener('resize', layoutHand);
  installTestHooks();
  const saved = Save.loadRun();
  if (saved) { G = saved; screen = 'game'; render(); }
  else showMenu();
}

/**
 * Hooks for tools/uitest.mjs so the browser smoke test can reach states that
 * would otherwise take a dozen lucky hands. Single-player and offline, so an
 * exposed debug surface costs nothing.
 */
function installTestHooks() {
  window.__test = {
    seed: () => G?.seed ?? null,
    state: () => G,
    giveMoney: (n) => { if (G) { G.money += n; render(); } },
    forceWin: () => {
      if (!G || G.phase !== 'playing') return false;
      G.target = 1;
      G.selected = [G.hand[0].id];
      Game.commitHand(G, Game.scoreSelected(G));
      render();
      return true;
    },
  };
}

function wireControls() {
  dom.btnPlay.addEventListener('click', onPlay);
  dom.btnDiscard.addEventListener('click', onDiscard);
  dom.btnSortRank.addEventListener('click', () => { Game.sortHand(G, 'rank'); sfx.tap(); render(); });
  dom.btnSortSuit.addEventListener('click', () => { Game.sortHand(G, 'suit'); sfx.tap(); render(); });
  dom.btnMenu.addEventListener('click', () => { sfx.tap(); showPauseMenu(); });
  dom.btnInfo.addEventListener('click', () => { sfx.tap(); showRunInfo(); });
  document.addEventListener('pointerdown', unlock, { once: true });
  document.addEventListener('pointerdown', (e) => {
    if (!dom.tip.hidden && !e.target.closest('.tip')) hideTip();
  });
}

// ------------------------------------------------------------ card builders --

function cardEl(card, opts = {}) {
  const stone = isStone(card);
  const suit = SUITS[card.suit];
  const node = el('div.card', {
    'data-id': card.id,
    'data-color': stone ? 'stone' : suit.color,
    'data-enh': card.enhancement || null,
    'data-ed': card.edition || null,
  });
  if (card.faceDown && !opts.reveal) {
    node.classList.add('facedown');
    return node;
  }
  if (!stone) {
    node.appendChild(el('span.rank', { text: RANK_LABEL[card.rank] }));
    node.appendChild(el('span.pip-sm', { text: suit.pip }));
    node.appendChild(el('span.pip-lg', { text: suit.pip }));
  } else {
    node.appendChild(el('span.pip-lg', { text: '⬛' }));
  }
  if (card.seal) node.appendChild(el('div.seal', { 'data-seal': card.seal }));
  if (card.debuffed) node.classList.add('debuffed');
  return node;
}

const JOKER_ART = ['🃏', '🎩', '🎭', '🎪', '🪄', '🔮', '💎', '🧿', '🎲', '⭐'];
function artFor(key) {
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return JOKER_ART[h % JOKER_ART.length];
}

function jokerEl(j, opts = {}) {
  const def = JOKER_BY_KEY[j.key];
  const node = el('div.joker', {
    'data-id': j.id,
    'data-rarity': def.rarity,
    'data-ed': j.edition || null,
  }, [
    el('div.jname', { text: def.name }),
    el('div.jart', { text: artFor(j.key) }),
  ]);
  if (opts.disabled) node.classList.add('off');
  return node;
}

const CONSUMABLE_ICON = { tarot: '🔯', planet: '🪐', spectral: '👻' };

function consumableEl(item) {
  const def = CONSUMABLE_BY_KEY[item.key];
  return el('div.consumable', { 'data-id': item.id, 'data-type': def.type }, [
    el('div.cicon', { text: CONSUMABLE_ICON[def.type] }),
    el('div', { text: def.name }),
  ]);
}

// ------------------------------------------------------------------ render --

function render() {
  if (!G) return;
  Game.recompute(G);
  renderTop();
  renderTrays();
  renderHand();
  renderPlayed();
  renderOverlay();
  Save.saveRun(G);
}

function renderTop() {
  const slot = BLIND_SLOTS[G.blindIndex];
  const boss = G.blindIndex === 2 ? BOSS_BY_KEY[G.bossKey] : null;
  const disabled = G.blindIndex === 2 && !Game.activeBoss(G);
  const target = G.phase === 'playing' ? G.target : Game.currentTarget(G);

  dom.blindChip.classList.toggle('boss', G.blindIndex === 2);
  $('.blind-name', dom.blindChip).textContent = boss ? `${boss.name}${disabled ? ' (off)' : ''}` : slot.name;
  $('.blind-target', dom.blindChip).textContent = fmt(target);

  dom.scoreValue.textContent = fmt(G.score);
  dom.scoreFill.style.width = `${clamp((G.score / Math.max(1, target)) * 100, 0, 100)}%`;

  dom.hudHands.textContent = G.hands;
  dom.hudDiscards.textContent = G.discards;
  dom.hudMoney.textContent = $m(G.money);
  dom.hudAnte.textContent = `${G.ante}/${Game.WIN_ANTE}`;
  dom.hudRound.textContent = G.round;
  dom.deckCount.textContent = `${G.drawPile.length}/${G.deck.length}`;

  const blocked = G.phase !== 'playing' || busy;
  dom.btnPlay.disabled = blocked || !!Game.playBlocker(G);
  dom.btnDiscard.disabled = blocked || !!Game.discardBlocker(G);
}

function renderTrays() {
  dom.jokers.replaceChildren();
  for (const j of G.jokers) {
    const node = jokerEl(j, { disabled: j.id === G.disabledJokerId });
    attachInspect(node, () => jokerTip(j));
    dom.jokers.appendChild(node);
  }
  for (let i = G.jokers.length; i < G.derived.jokerSlots; i++) {
    dom.jokers.appendChild(el('div.slot-empty'));
  }

  dom.consumables.replaceChildren();
  for (const u of G.consumables) {
    const node = consumableEl(u);
    attachInspect(node, () => consumableTip(u), () => useConsumable(u));
    dom.consumables.appendChild(node);
  }
  for (let i = G.consumables.length; i < G.derived.consumableSlots; i++) {
    dom.consumables.appendChild(el('div.slot-empty', { style: { width: 'calc(var(--card-w) * 0.8)' } }));
  }
}

function renderHand() {
  dom.hand.replaceChildren();
  for (const c of G.hand) {
    const node = cardEl(c);
    if (G.selected.includes(c.id)) node.classList.add('sel');
    if (c.id === G.forcedCardId) node.classList.add('forced');
    attachInspect(node, () => cardTip(c), () => {
      if (busy || G.phase !== 'playing') return;
      const was = G.selected.includes(c.id);
      Game.toggleSelect(G, c.id);
      if (G.selected.includes(c.id) !== was) { was ? sfx.deselect() : sfx.select(); buzz(6); }
      renderHand();
      renderTop();
      renderHandName();
    });
    dom.hand.appendChild(node);
  }
  layoutHand();
  renderHandName();
}

/**
 * Fan the hand so it always fits the screen width.
 * Measured against the viewport rather than the row: the row's own width can be
 * inflated by the very cards being measured, which would feed back positively.
 */
function layoutHand() {
  const n = G?.hand.length ?? 0;
  if (n < 2) { document.documentElement.style.setProperty('--hand-overlap', '2px'); return; }

  const viewport = document.documentElement.clientWidth;
  const avail = Math.min(dom.hand.clientWidth, viewport) - 8;
  const cw = dom.hand.firstElementChild?.getBoundingClientRect().width || 50;
  const natural = n * cw + (n - 1) * 2;

  const overlap = natural <= avail ? 2 : (avail - n * cw) / (n - 1);
  // Never stack cards so tightly that a rank is unreadable or untappable.
  const clamped = Math.max(-cw * 0.62, Math.min(2, overlap));
  document.documentElement.style.setProperty('--hand-overlap', `${clamped}px`);
}

function renderHandName() {
  const sel = Game.selectedCards(G);
  if (!sel.length || G.phase !== 'playing') { dom.handName.textContent = ''; return; }
  const key = evaluate(sel, Game.activeRules(G)).key;
  const st = handStats(key, G.handLevels);
  dom.handName.innerHTML =
    `${HAND_BY_KEY[key].name} <span class="lvl">Lv.${st.level}</span> · ` +
    `<span class="c-chips">${st.chips}</span> × <span class="c-mult">${st.mult}</span>`;
}

function renderPlayed() {
  dom.played.replaceChildren();
  for (const c of G.playedZone) dom.played.appendChild(cardEl(c, { reveal: true }));
}

// -------------------------------------------------------------- inspection --

/** Tap fires `onTap`; press-and-hold (or tap with no handler) opens the tip. */
function attachInspect(node, tipFn, onTap) {
  let timer = null;
  let moved = false;
  let held = false;

  const start = (e) => {
    moved = false;
    held = false;
    timer = setTimeout(() => {
      held = true;
      buzz(10);
      showTip(node, tipFn());
    }, 380);
    void e;
  };
  const move = () => { moved = true; clearTimeout(timer); };
  const end = () => {
    clearTimeout(timer);
    if (held || moved) return;
    if (onTap) onTap();
    else showTip(node, tipFn());
  };

  node.addEventListener('pointerdown', start);
  node.addEventListener('pointermove', move);
  node.addEventListener('pointerup', end);
  node.addEventListener('pointercancel', () => clearTimeout(timer));
  node.addEventListener('contextmenu', (e) => e.preventDefault());
}

function showTip(anchor, content) {
  dom.tip.replaceChildren(content);
  dom.tip.hidden = false;
  const r = anchor.getBoundingClientRect();
  const t = dom.tip.getBoundingClientRect();
  let left = r.left + r.width / 2 - t.width / 2;
  left = clamp(left, 8, window.innerWidth - t.width - 8);
  let top = r.top - t.height - 8;
  if (top < 8) top = r.bottom + 8;
  dom.tip.style.left = `${left}px`;
  dom.tip.style.top = `${top}px`;
}

const hideTip = () => { dom.tip.hidden = true; };

function jokerTip(j) {
  const def = JOKER_BY_KEY[j.key];
  const r = RARITY[def.rarity];
  return el('div', {}, [
    el('div.tname', { text: def.name }),
    el('div.trarity', { text: r.name + (j.edition ? ` · ${EDITIONS[j.edition].name}` : ''), style: { color: r.color } }),
    el('div', { text: jokerText(j, G), style: { marginTop: '4px' } }),
    j.edition ? el('div.muted', { text: EDITIONS[j.edition].blurb }) : null,
    el('div.tsell', { text: `Sell for ${$m(sellValue(j.cost))} · hold to inspect, tap to sell in the shop` }),
  ]);
}

function consumableTip(u) {
  const def = CONSUMABLE_BY_KEY[u.key];
  return el('div', {}, [
    el('div.tname', { text: def.name }),
    el('div.trarity', { text: def.type }),
    el('div', { text: consumableText(u, G), style: { marginTop: '4px' } }),
    el('div.tsell', { text: 'Tap to use' }),
  ]);
}

function cardTip(c) {
  const bits = [];
  if (c.enhancement) bits.push(`${ENHANCEMENTS[c.enhancement].name} — ${ENHANCEMENTS[c.enhancement].blurb}`);
  if (c.edition) bits.push(`${EDITIONS[c.edition].name} — ${EDITIONS[c.edition].blurb}`);
  if (c.seal) bits.push(`${SEALS[c.seal].name} — ${SEALS[c.seal].blurb}`);
  if (c.debuffed) bits.push('Debuffed by the Boss Blind — scores nothing.');
  return el('div', {}, [
    el('div.tname', { text: cardLabel(c) }),
    bits.length ? el('div', { html: bits.join('<br>') }) : el('div.muted', { text: 'An ordinary playing card.' }),
  ]);
}

// ------------------------------------------------------------- interactions --

async function onPlay() {
  const why = Game.playBlocker(G);
  if (why) return toast(why, true);
  busy = true;
  hideTip();
  dom.btnPlay.disabled = dom.btnDiscard.disabled = true;

  const result = Game.scoreSelected(G);
  await animateScore(result);
  Game.commitHand(G, result);

  busy = false;
  render();

  if (G.phase === 'round_end') { sfx.win(); banner('Blind Defeated!', 'var(--good)'); }
  else if (G.phase === 'game_over') { sfx.lose(); Save.recordRun(G, false); }
}

function onDiscard() {
  const why = Game.discardBlocker(G);
  if (why) return toast(why, true);
  sfx.discard();
  buzz(12);
  Game.discardSelected(G);
  render();
}

function useConsumable(u) {
  const why = Game.consumableBlocker(G, u);
  if (why) { sfx.error(); return toast(why, true); }
  const out = Game.useConsumable(G, u.id);
  if (out.ok === false) { sfx.error(); return toast(out.msg ?? 'Cannot use that', true); }
  sfx.buy();
  buzz(14);
  toast(out.msg);
  render();
}

// --------------------------------------------------------------- animation --

async function animateScore(result) {
  const fast = settings.fastScoring;
  const beat = fast ? 55 : 130;
  dom.calc.hidden = false;

  // Move the played cards into the play area before the maths starts.
  dom.played.replaceChildren();
  for (const c of result.played) dom.played.appendChild(cardEl(c, { reveal: true }));
  setCalc(0, 0);
  await sleep(fast ? 60 : 180);

  let step = 0;
  for (const e of result.events) {
    if (e.kind === 'total') break;
    setCalc(e.chips, e.mult);
    if (e.kind === 'base') { sfx.chip(0); await sleep(beat); continue; }

    const node = e.refId ? findRef(e.refId) : null;
    if (node) {
      node.classList.add(node.classList.contains('joker') ? 'trigger' : 'scoring');
      setTimeout(() => node.classList.remove('trigger', 'scoring'), 420);
    }

    for (const f of floatsFor(e)) spawnFloat(node, f.text, f.cls);
    playBeat(e, step++);
    await sleep(beat);
  }

  const final = result.events[result.events.length - 1];
  setCalc(final.chips, final.mult);
  dom.calc.classList.add('bump');
  setTimeout(() => dom.calc.classList.remove('bump'), 220);
  sfx.xmult();
  buzz(20);
  await sleep(fast ? 120 : 260);

  // Slam the total into the score readout.
  const before = G.score;
  const after = before + result.total;
  await countUp(before, after, fast ? 220 : 460);
  dom.scoreValue.classList.add('pop');
  setTimeout(() => dom.scoreValue.classList.remove('pop'), 280);
  dom.scoreFill.style.width = `${clamp((after / Math.max(1, G.target)) * 100, 0, 100)}%`;
  await sleep(fast ? 100 : 260);
  dom.calc.hidden = true;
}

function floatsFor(e) {
  const out = [];
  const d = e.d ?? {};
  if (d.chips) out.push({ text: `+${fmt(d.chips)}`, cls: 'chips' });
  if (d.mult) out.push({ text: `+${fmt(d.mult)}`, cls: 'mult' });
  if (d.xmult && d.xmult !== 1) out.push({ text: `×${fmt(d.xmult)}`, cls: 'mult' });
  if (d.money) out.push({ text: `+${$m(d.money)}`, cls: 'money' });
  if (e.text && !out.length) out.push({ text: e.text, cls: 'info' });
  else if (e.text && e.text !== 'again!') out.push({ text: e.text, cls: 'info' });
  return out;
}

function playBeat(e, step) {
  const d = e.d ?? {};
  if (d.xmult && d.xmult !== 1) sfx.xmult();
  else if (d.mult) sfx.mult(step);
  else if (d.chips) sfx.chip(step);
  if (d.money) sfx.money();
}

function findRef(id) {
  return document.querySelector(`#played [data-id="${id}"]`)
    || document.querySelector(`#hand [data-id="${id}"]`)
    || document.querySelector(`#jokers [data-id="${id}"]`)
    || document.querySelector(`#consumables [data-id="${id}"]`);
}

function setCalc(chips, mult) {
  dom.calcChips.textContent = fmt(Math.round(chips));
  dom.calcMult.textContent = fmt(Math.round(mult * 100) / 100);
}

function spawnFloat(anchor, text, cls) {
  const r = anchor ? anchor.getBoundingClientRect() : dom.calc.getBoundingClientRect();
  const node = el(`div.float.${cls}`, { text });
  node.style.left = `${r.left + r.width / 2}px`;
  node.style.top = `${r.top}px`;
  dom.fx.appendChild(node);
  setTimeout(() => node.remove(), 820);
}

function countUp(from, to, ms) {
  return new Promise((resolve) => {
    const t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      const eased = 1 - Math.pow(1 - k, 3);
      dom.scoreValue.textContent = fmt(Math.round(from + (to - from) * eased));
      if (k < 1) requestAnimationFrame(tick);
      else resolve();
    };
    requestAnimationFrame(tick);
  });
}

function banner(text, color) {
  const node = el('div.banner', { text, style: { color: color ?? 'var(--ink)' } });
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 1250);
}

let toastTimer = null;
function toast(msg, bad = false) {
  if (!msg) return;
  dom.toast.textContent = msg;
  dom.toast.hidden = false;
  dom.toast.style.borderColor = bad ? 'var(--bad)' : 'var(--line)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { dom.toast.hidden = true; }, 1700);
}

// ------------------------------------------------------------------ overlay --

function openSheet(node) {
  dom.overlay.replaceChildren(node);
  dom.overlay.hidden = false;
}
function closeSheet() {
  dom.overlay.hidden = true;
  dom.overlay.replaceChildren();
}

function sheet({ title, right, body, footer }) {
  return el('div.sheet', {}, [
    el('header', {}, [el('h2', { text: title }), right ?? el('span')]),
    el('div.body', {}, body),
    el('footer', {}, footer ?? []),
  ]);
}

function renderOverlay() {
  if (busy) return;
  switch (G?.phase) {
    case 'blind_select': return openSheet(blindSelectSheet());
    case 'round_end': return openSheet(cashoutSheet());
    case 'shop': return openSheet(shopSheet());
    case 'pack': return openSheet(packSheet());
    case 'game_over': return openSheet(gameOverSheet());
    case 'win': return openSheet(winSheet());
    default: return closeSheet();
  }
}

// ------------------------------------------------------------- blind select --

function blindSelectSheet() {
  Game.ensureBoss(G);
  const rows = BLIND_SLOTS.map((slot, i) => {
    const isBoss = i === 2;
    const boss = isBoss ? BOSS_BY_KEY[G.bossKey] : null;
    const done = i < G.blindIndex;
    const current = i === G.blindIndex;
    const target = Math.round(blindTarget(G.ante, i, isBoss ? G.bossKey : null) * (G.mods?.blindMult ?? 1));

    return el(`div.blind-card${current ? '.current' : ''}${done ? '.done' : ''}${isBoss ? '.bossrow' : ''}`, {}, [
      el('div.blind-badge', { text: done ? '✓' : ['🔹', '🔶', '💀'][i] }),
      el('div', {}, [
        el('div.title', { text: boss ? boss.name : slot.name }),
        el('div.sub', { text: boss ? boss.desc : (i === 0 ? 'An easy opener.' : 'A little heavier.') }),
      ]),
      el('div', {}, [
        el('div.req', { text: fmt(target) }),
        el('div.reward', { text: `${'$'.repeat(slot.reward)}` }),
      ]),
    ]);
  });

  const canSkip = Game.canSkipBlind(G);
  const tagKey = G.upcomingTags?.[G.blindIndex];
  const tag = tagKey ? TAG_BY_KEY[tagKey] : null;

  const footer = [
    el('button.btn.green.wide', {
      text: `Play ${G.blindIndex === 2 ? 'Boss Blind' : BLIND_SLOTS[G.blindIndex].name}`,
      onclick: () => {
        sfx.tap();
        Game.startBlind(G);
        closeSheet();
        render();
        if (G.blindIndex === 2 && Game.activeBoss(G)) { sfx.boss(); banner(BOSS_BY_KEY[G.bossKey].name, 'var(--mult)'); }
      },
    }),
  ];
  if (canSkip) {
    footer.unshift(el('button.btn.ghost', {
      text: 'Skip',
      onclick: () => {
        sfx.tap();
        const out = Game.skipBlind(G);
        if (out?.tagKey) toast(`${TAG_BY_KEY[out.tagKey].name}${out.money ? ` · +${$m(out.money)}` : ''}`);
        render();
      },
    }));
  }

  const body = [
    el('div.blind-grid', {}, rows),
    tag && canSkip ? el('div', { style: { marginTop: '12px' } }, [
      el('h3', { text: 'Skip reward' }),
      el('div.tag-pill', { text: `🏷 ${tag.name}` }),
      el('div.muted', { text: tag.desc }),
    ]) : null,
    G.tags.length ? el('div', { style: { marginTop: '12px' } }, [
      el('h3', { text: 'Tags held' }),
      ...G.tags.map((t) => el('span.tag-pill', { text: `🏷 ${TAG_BY_KEY[t.key].name}` })),
    ]) : null,
    G.vouchers.has('directors_cut') && !G.bossRerolled ? el('button.btn.tiny', {
      text: 'Reroll Boss ($10)',
      style: { marginTop: '10px' },
      onclick: () => { if (Game.rerollBoss(G)) { sfx.buy(); render(); } else { sfx.error(); toast('Not enough money', true); } },
    }) : null,
  ].filter(Boolean);

  return sheet({ title: `Ante ${G.ante}`, right: el('span.muted', { text: $m(G.money) }), body, footer });
}

// ------------------------------------------------------------------ cashout --

function cashoutSheet() {
  const c = G.cashout;
  const body = [
    el('div.center', { style: { padding: '10px 0' } }, [
      el('div', { text: '💰', style: { fontSize: '42px' } }),
      el('div', { text: `${c.blindName} defeated`, style: { fontWeight: '900', fontSize: '17px' } }),
      el('div.muted', { text: `Scored ${fmt(G.score)} of ${fmt(G.target)}` }),
    ]),
    el('div.cash-lines', {}, c.lines.map((l) =>
      el('div.cash-line', {}, [el('span', { text: l.label }), el('span.amt', { text: $m(l.amount) })]))),
    el('div.cash-total', {}, [el('span', { text: 'Total earned' }), el('span.amt', { text: $m(c.total) })]),
  ];
  const footer = [el('button.btn.gold.wide', {
    text: 'Cash Out',
    onclick: () => { sfx.money(); Game.leaveCashout(G); render(); },
  })];
  return sheet({ title: 'Cash Out', right: el('span.muted', { text: $m(G.money) }), body, footer });
}

// --------------------------------------------------------------------- shop --

function shopSheet() {
  const s = G.shop;
  const body = [];

  body.push(el('h3', { text: 'For sale' }));
  const grid = el('div.shop-grid');
  if (!s.items.length) grid.appendChild(el('div.muted', { text: 'Sold out.' }));
  for (const item of s.items) {
    const price = Game.itemPrice(G, item);
    const tile = el('div.shop-item');
    let preview;
