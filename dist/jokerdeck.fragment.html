  --gold: #ffcd75;

  --rare: #ef476f;
  --uncommon: #38b764;
  --common: #41a6f6;
  --legendary: #a663cc;

  --paper: #f4f0e2;
  --paper-2: #ded8c4;

  --card-w: clamp(46px, min(14.5vw, 8.2vh), 88px);
  --card-h: calc(var(--card-w) * 1.4);
  --radius: 5px;
  --pad: 8px;

  /* Cartoon language: one ink colour, thick outlines, hard offset shadows. */
  --ink-line: #12161c;
  --stroke: 3px;
  --toon-shadow: 0 4px 0 var(--ink-line);
  --toon-shadow-lg: 0 6px 0 var(--ink-line);

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  /* Two pixel faces, embedded in css/fonts.css. Silkscreen is the arcade
     voice for numbers, labels and buttons; Pixelify Sans stays readable in
     running text. */
  --font: 'Pixelify Sans', ui-rounded, system-ui, -apple-system, sans-serif;
  --font-display: 'Silkscreen', 'Pixelify Sans', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Class rules like `.overlay { display: grid }` outrank the UA stylesheet's
   `[hidden] { display: none }`, which would leave an invisible overlay sitting
   on top of the board eating every tap. Make `hidden` win, always. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.3;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

button { font-family: inherit; color: inherit; }

/* Scanlines over everything, menus included — the retro framing is part of the
   game world rather than a filter on the board. Hard-stop stripes, so this is
   flat colour banding and not a blend. */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 200;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.13) 0 1px, transparent 1px 3px);
}
body.no-crt::after { display: none; }

/* SVG pixel art must never be smoothed when scaled up. */
svg { image-rendering: pixelated; }

/* ------------------------------------------------------------- app shell -- */

#app {
  position: fixed;
  inset: 0;
  display: grid;
  /* An implicit `auto` column is sized to min-content, so a wide card row would
     stretch the container and push the hand off-screen. Pin it to the width. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto auto;
  padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  background: var(--bg);
}

/* Grid and flex children default to min-width:auto, which lets wide rows blow
   out their container. Every layout row here should shrink instead. */
#app > *, #board > *, #tray-row > *, #play-area > *, #handzone > * { min-width: 0; }

/* ---------------------------------------------------------------- topbar -- */

#topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px 2px;
}

.icon-btn {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  border-radius: 6px;
  border: 2px solid var(--ink-line);
  box-shadow: 0 2px 0 var(--ink-line);
  background: var(--panel);
  font-size: 17px;
  font-weight: 700;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.icon-btn:active { transform: scale(0.94); }

.blind-chip {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 38px;
  padding: 0 12px;
  border-radius: 6px;
  background: var(--panel-2);
  border: 2px solid var(--ink-line);
  box-shadow: 0 2px 0 var(--ink-line);
  overflow: hidden;
}
.blind-chip .blind-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.blind-chip .blind-target {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 11px;
  color: var(--mult);
  white-space: nowrap;
}
.blind-chip.boss { border-color: var(--ink-line); background: #5d275d; }

/* ------------------------------------------------------------ score line -- */

#scoreline { padding: 4px 10px 2px; }

.score-block {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
}
.score-block .label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.score-block .value {
  font-family: var(--font-display);
  font-size: clamp(19px, 6vw, 30px);
  font-weight: 700;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.score-block .value.pop { animation: pop 260ms cubic-bezier(.2,1.6,.4,1); }

#score-bar {
  margin-top: 4px;
  height: 6px;
  border-radius: 3px;
  background: #0d1418;
  border: 1px solid var(--line);
  overflow: hidden;
}
#score-fill {
  height: 100%;
  width: 0%;
  border-radius: 3px;
  background: var(--good);
  transition: width 280ms ease-out;
}

/* ----------------------------------------------------------------- board -- */

#board {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  gap: 4px;
  padding: 4px 8px 0;
}

#tray-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px;
  align-items: start;
}

.tray {
  display: flex;
  gap: 4px;
  min-height: calc(var(--card-h) * 1.02);
  padding: 5px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px dashed var(--line);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.tray::-webkit-scrollbar { display: none; }
.tray.small { flex: 0 0 auto; }
.tray-count {
  position: absolute;
  right: 6px;
  bottom: 2px;
  font-size: 9px;
  color: var(--ink-dim);
}

#play-area {
  position: relative;
  align-self: stretch;         /* the felt is the table; piles occupy its corners */
  width: 100%;
  min-height: calc(var(--card-h) * 1.9);
  display: grid;
  grid-template-rows: auto auto auto;
  place-items: center;
  align-content: center;       /* cards sit in the middle of the table */
  gap: 6px;
  padding: 10px 6px;
  border-radius: 6px;
  background: var(--felt);
  border: var(--stroke) solid var(--ink-line);
  box-shadow: inset 0 0 0 3px var(--felt-dark);
}

.calc {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(13px, 4.4vw, 20px);
}
.calc .chips {
  padding: 3px 12px;
  border-radius: 5px;
  background: #06263d;
  color: var(--chips);
  border: var(--stroke) solid var(--ink-line);
  box-shadow: 0 3px 0 var(--ink-line);
}
.calc .mult {
  padding: 3px 12px;
  border-radius: 5px;
  background: #3c1512;
  color: var(--mult);
  border: var(--stroke) solid var(--ink-line);
  box-shadow: 0 3px 0 var(--ink-line);
}
.calc .times { color: var(--ink-dim); font-size: 0.8em; }
.calc.bump { animation: pop 200ms ease-out; }

#played { min-height: var(--card-h); align-items: center; }

/* Draw and discard stacks sit in the table corners — they fill the felt and
   tell you how much deck is left without a separate readout. */
.pile {
  position: absolute;
  bottom: 8px;
  width: calc(var(--card-w) * 0.62);
  display: grid;
  justify-items: center;
  gap: 3px;
  opacity: 0.95;
}
#pile-draw { left: 10px; }
#pile-discard { right: 10px; }
.pile .stack {
  position: relative;
  width: 100%;
  aspect-ratio: 5 / 7;
}
.pile .stack > * {
  position: absolute;
  inset: 0;
  border: 2px solid var(--ink-line);
  border-radius: 3px;
  overflow: hidden;
}
.pile .stack svg { width: 100%; height: 100%; display: block; }
.pile .stack .slab { background: var(--paper-2); }
.pile .count {
  font-family: var(--font-display);
  font-size: 8px;
  color: #bfe0cf;
}
.pile.empty { opacity: 0.35; }

.hand-name {
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-dim);
  min-height: 15px;
}

/* ------------------------------------------------------------------- HUD -- */

#hud {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 6px 8px 4px;
}
.hud-cell {
  display: grid;
  place-items: center;
  gap: 1px;
  padding: 4px 2px;
  border-radius: 5px;
  background: var(--panel);
  border: 2px solid var(--ink-line);
  box-shadow: 0 2px 0 var(--ink-line);
}
.hud-label {
  font-family: var(--font-display);
  font-size: 7px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.hud-val { font-family: var(--font-display); font-size: 12px; font-weight: 700; }
.hud-val.hands { color: var(--chips); }
.hud-val.discards { color: var(--mult); }
.hud-val.money { color: var(--money); }
.hud-val.spent { animation: shake 300ms; }

/* ------------------------------------------------------------- hand zone -- */

#handzone {
  position: relative;
  padding: 2px 8px calc(6px + var(--safe-b));
}

.card-row {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  min-height: var(--card-h);
  max-width: 100%;
}
.hand-row { padding-top: 14px; }
.hand-row .card + .card { margin-left: var(--hand-overlap, 2px); }

#actions {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.btn {
  border: none;
  border-radius: 6px;
  padding: 12px 10px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  cursor: pointer;
  border: var(--stroke) solid var(--ink-line);
  box-shadow: var(--toon-shadow);
  transition: transform 80ms ease, filter 120ms ease, box-shadow 80ms ease;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink-line); }
.btn:focus-visible { outline: 3px solid var(--chips); outline-offset: 2px; }
.btn:disabled { filter: grayscale(0.7) brightness(0.6); cursor: default; }
.btn.play { background: var(--chips); color: #06213a; }
.btn.discard { background: var(--mult); color: #3a0713; }
.btn.tiny { padding: 7px 9px; font-size: 12px; background: var(--panel-2); color: var(--ink); }
.btn.ghost { background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
.btn.gold { background: var(--money); color: #3a2a05; }
.btn.green { background: var(--good); color: #06210f; }
.btn.wide { width: 100%; }

.sort-group { display: grid; justify-items: center; gap: 3px; }
.sort-label { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-dim); }
.sort-group > div { display: flex; gap: 4px; }

.deck-count {
  position: absolute;
  right: 10px;
  top: 0;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-dim);
}

/* ---------------------------------------------------------------- cards -- */

.card {
  position: relative;
  flex: 0 0 auto;
  width: var(--card-w);
  height: var(--card-h);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink-line);
  border: var(--stroke) solid var(--ink-line);
  box-shadow: var(--toon-shadow);
  transition: transform 140ms cubic-bezier(.2,1.4,.4,1), box-shadow 140ms ease, filter 160ms ease;
  will-change: transform;
  cursor: pointer;
}
.card.sel {
  transform: translateY(-15px) rotate(-2deg);
  border-color: var(--chips);
  box-shadow: 0 8px 0 var(--ink-line), 0 0 0 3px rgba(41,168,255,.35);
}
.card.forced { border-color: var(--legendary); box-shadow: 0 6px 0 var(--ink-line), 0 0 0 3px rgba(180,91,224,.35); }
.card.flew { opacity: 0; transition: opacity 90ms; }
.card:active { filter: brightness(1.08); }
.card.debuffed { filter: grayscale(1) brightness(0.55); }
.card.debuffed::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,0,0,.28) 5px 10px);
}
.card.scoring { animation: score-hop 380ms cubic-bezier(.2,1.5,.4,1); z-index: 5; }
.card.dead { opacity: .35; }

.card .rank {
  position: absolute;
  top: 3px;
  left: 4px;
  font-family: var(--font-display);
  font-size: calc(var(--card-w) * 0.3);
  font-weight: 700;
  line-height: 1;
}
.card .pip-sm {
  position: absolute;
  top: calc(var(--card-w) * 0.34);
  left: 4px;
  width: calc(var(--card-w) * 0.2);
}
.card .pip-lg {
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: calc(var(--card-w) * 0.44);
}
.card .pip-sm svg, .card .pip-lg svg { width: 100%; height: auto; display: block; }
.card[data-color="red"] { color: #cf2b3a; }
.card[data-color="black"] { color: #1a232b; }

/* Face-down (The Sun boss). */
.card.facedown { background: #3a5f9e; padding: 0; overflow: hidden; }
.card.facedown svg { width: 100%; height: 100%; display: block; }

/* Enhancements repaint the card face. */
.card[data-enh="bonus"] { background: #a7d3f5; }
.card[data-enh="mult"]  { background: #f5a3a3; }
.card[data-enh="wild"]  { background: #ffd88a; }
.card[data-enh="glass"] { background: #cfeff5; }
.card[data-enh="steel"] { background: #b6bfd0; }
.card[data-enh="stone"] { background: #8b93a3; color: var(--ink-line); }
.card[data-enh="stone"] .rank, .card[data-enh="stone"] .pip-sm, .card[data-enh="stone"] .pip-lg { display: none; }
.card[data-enh="gold"]  { background: var(--money); }
.card[data-enh="lucky"] { background: #a7e0a0; }

/* Editions sit on top as a sheen. */
.card[data-ed]::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  pointer-events: none;
  mix-blend-mode: screen;
}
.card[data-ed="foil"]::before { background: repeating-linear-gradient(135deg, rgba(65,166,246,.55) 0 4px, transparent 4px 8px); }
.card[data-ed="holo"]::before { background: repeating-linear-gradient(135deg, rgba(166,99,204,.55) 0 4px, rgba(65,166,246,.4) 4px 8px); }
.card[data-ed="poly"]::before {
  background: repeating-linear-gradient(135deg,
    rgba(239,71,111,.5) 0 4px, rgba(255,205,117,.5) 4px 8px,
    rgba(56,183,100,.5) 8px 12px, rgba(65,166,246,.5) 12px 16px);
}
.card[data-ed="negative"]::before { background: #000; mix-blend-mode: exclusion; }

.card .seal {
  position: absolute;
  top: 3px;
  right: 3px;
  width: calc(var(--card-w) * 0.26);
  height: calc(var(--card-w) * 0.26);
  border-radius: 2px;
  box-shadow: inset 0 0 0 2px var(--ink-line);
}
.seal[data-seal="gold"] { background: #e8c25a; }
.seal[data-seal="red"] { background: #e0554d; }
.seal[data-seal="blue"] { background: #4d9de0; }
.seal[data-seal="purple"] { background: #a05de0; }

/* ---------------------------------------------------------------- jokers -- */

.joker {
  position: relative;
  flex: 0 0 auto;
  width: calc(var(--card-w) * 1.06);
  height: calc(var(--card-h) * 0.94);
  border-radius: var(--radius);
  padding: 4px 3px;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 2px;
  background: var(--paper);
  color: var(--ink-line);
  border: var(--stroke) solid var(--ink-line);
  box-shadow: var(--toon-shadow);
  overflow: hidden;
  cursor: pointer;
  transition: transform 120ms ease;
  animation: joker-idle 3.4s ease-in-out infinite;
}
.joker:nth-child(2n) { animation-delay: -1.1s; }
.joker:nth-child(3n) { animation-delay: -2.2s; }
.joker:active { transform: scale(0.95); }
.joker .jname {
  font-family: var(--font-display);
  font-size: calc(var(--card-w) * 0.098);
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  /* Break between words only — mid-word breaks produced "BLUEPRIN / T". */
  overflow-wrap: normal;
  word-break: keep-all;
  hyphens: none;
}
.joker .jart {
  border-radius: 4px;
  overflow: hidden;
  background: rgba(0,0,0,.06);
  display: grid;
  place-items: stretch;
}
.joker .jart svg { width: 100%; height: 100%; display: block; }
.joker[data-rarity="1"] { border-bottom: 5px solid var(--common); }
.joker[data-rarity="2"] { border-bottom: 5px solid var(--uncommon); }
.joker[data-rarity="3"] { border-bottom: 5px solid var(--rare); }
.joker[data-rarity="4"] { border-bottom: 5px solid var(--legendary); }
.joker.trigger { animation: score-hop 360ms cubic-bezier(.2,1.5,.4,1); z-index: 6; }
.joker.off { filter: grayscale(1) brightness(.6); }
.joker[data-ed]::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: screen;
}
.joker[data-ed="foil"]::before { background: repeating-linear-gradient(135deg, rgba(65,166,246,.5) 0 4px, transparent 4px 8px); }
.joker[data-ed="holo"]::before { background: repeating-linear-gradient(135deg, rgba(166,99,204,.5) 0 4px, rgba(65,166,246,.35) 4px 8px); }
.joker[data-ed="poly"]::before { background: repeating-linear-gradient(135deg, rgba(239,71,111,.45) 0 4px, rgba(255,205,117,.45) 4px 8px, rgba(56,183,100,.45) 8px 12px, rgba(65,166,246,.45) 12px 16px); }
.joker[data-ed="negative"]::before { background: #000; mix-blend-mode: exclusion; }

.consumable {
  flex: 0 0 auto;
  width: calc(var(--card-w) * 0.8);
  height: calc(var(--card-h) * 0.92);
  border-radius: var(--radius);
  display: grid;
  grid-template-rows: 1fr auto;
  place-items: center;
  gap: 2px;
  padding: 3px 2px;
  font-size: calc(var(--card-w) * 0.15);
  font-weight: 800;
  text-align: center;
  line-height: 1.05;
  color: #16202a;
  border: var(--stroke) solid var(--ink-line);
  box-shadow: var(--toon-shadow);
  cursor: pointer;
  overflow: hidden;
}
.consumable .cicon { width: 100%; min-height: 0; display: grid; place-items: center; }
.consumable .cicon svg { width: 78%; height: auto; display: block; }
.consumable .cname { font-size: calc(var(--card-w) * 0.15); line-height: 1.05; }
.consumable[data-type="tarot"] { background: #c3a0e8; }
.consumable[data-type="planet"] { background: #93c4ec; }
.consumable[data-type="spectral"] { background: #8fd4c8; }
.consumable:active { transform: scale(0.95); }

.slot-empty {
  flex: 0 0 auto;
  width: calc(var(--card-w) * 1.06);
  height: calc(var(--card-h) * 0.92);
  border-radius: var(--radius);
  border: 1px dashed var(--line);
  opacity: .5;
}

/* -------------------------------------------------------------- overlays -- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  background: rgba(18, 22, 28, 0.9);
  padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 10px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 10px);
  animation: fade 160ms ease-out;
}

.sheet {
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 8px;
  border-radius: 4px;
  background: var(--bg-2);
  border: var(--stroke) solid var(--ink-line);
  box-shadow: var(--toon-shadow-lg);
  overflow: hidden;
}
.sheet > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 14px 0;
}
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0; }
.sheet h3 { margin: 14px 0 6px; font-family: var(--font-display); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-dim); }
.sheet > .body {
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 14px;
}
.sheet > footer {
  display: flex;
  gap: 8px;
  padding: 0 14px calc(12px + var(--safe-b));
}
.sheet > footer .btn { flex: 1; }

.muted { color: var(--ink-dim); font-size: 13px; }
.center { text-align: center; }

/* Blind select */
.blind-grid { display: grid; gap: 10px; }
.blind-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 6px;
  background: var(--panel);
  border: 1px solid var(--line);
}
.blind-card.current { border-color: var(--chips); box-shadow: 0 0 0 2px rgba(41,168,255,.25); }
.blind-card.done { opacity: .45; }
.blind-card.bossrow { border-color: #7a3a4a; }
.blind-badge {

  poly:  { key: 'poly',  name: 'Polychrome',  blurb: 'x1.5 Mult' },
  negative: { key: 'negative', name: 'Negative', blurb: '+1 Joker slot' },
};

const SEALS = {
  gold:   { key: 'gold',   name: 'Gold Seal',   blurb: 'earns $3 when scored' },
  red:    { key: 'red',    name: 'Red Seal',    blurb: 'retriggers this card once' },
  blue:   { key: 'blue',   name: 'Blue Seal',   blurb: 'creates a Planet card if held at end of round' },
  purple: { key: 'purple', name: 'Purple Seal', blurb: 'creates a Tarot card when discarded' },
};

function makeCard(rank, suit, extra = {}) {
  return {
    id: uid('c'),
    rank,
    suit,
    enhancement: null,
    edition: null,
    seal: null,
    debuffed: false,
    ...extra,
  };
}

function standardDeck() {
  const deck = [];
  for (const s of SUIT_KEYS) for (const r of RANKS) deck.push(makeCard(r, s));
  return deck;
}

/** Stone cards have no usable rank; several systems must skip them. */
const isStone = (c) => c.enhancement === 'stone';

function cardLabel(c) {
  if (isStone(c)) return 'Stone';
  return RANK_LABEL[c.rank] + SUITS[c.suit].pip;
}

/** Chip value contributed by the card's face. Aces are 11, faces are 10. */
function baseChips(c) {
  if (isStone(c)) return 50;
  if (c.rank === 14) return 11;
  if (c.rank >= 11) return 10;
  return c.rank;
}

const isFace = (c) => !isStone(c) && c.rank >= 11 && c.rank <= 13;

/** Wild cards satisfy every suit query. */
function hasSuit(c, suit) {
  if (isStone(c)) return false;
  if (c.enhancement === 'wild') return true;
  return c.suit === suit;
}

/** Rank arithmetic wraps 2..A, used by Strength and a few jokers. */
function bumpRank(c, delta = 1) {
  if (isStone(c)) return c;
  let r = c.rank + delta;
  if (r > 14) r = 2;
  if (r < 2) r = 14;
  c.rank = r;
  return c;
}

function sellValue(cost) { return Math.max(1, Math.floor(cost / 2)); }

/** Sorting helpers used by the two hand-sort buttons. */
const bySuit = (a, b) =>
  SUIT_KEYS.indexOf(a.suit) - SUIT_KEYS.indexOf(b.suit) || b.rank - a.rank;
const byRank = (a, b) =>
  b.rank - a.rank || SUIT_KEYS.indexOf(a.suit) - SUIT_KEYS.indexOf(b.suit);

return { SUITS, SUIT_KEYS, RANK_LABEL, RANKS, ENHANCEMENTS, EDITIONS, SEALS, makeCard, standardDeck, isStone, cardLabel, baseChips, isFace, hasSuit, bumpRank, sellValue, bySuit, byRank };
});

  else if (top >= 2 && second >= 2) { key = 'two_pair'; scoring = [...groups[0].slice(0, 2), ...groups[1].slice(0, 2)]; }

 * rather than an exact hand. Four of a Kind contains a Pair, and so on.

  def.init?.(j);

  apply: (G, sel, api) => {
    const total = G.jokers.reduce((s, j) => s + Math.max(1, Math.floor(j.cost / 2)), 0);
    api.addMoney(Math.min(50, total));
    return { msg: 'Temperance' };
  } });

C({ key: 'judgement', name: 'Judgement', type: 'tarot', cost: 3, sel: none,
  text: () => 'Creates a random Joker',
  apply: (G, sel, api) => (api.createJoker() ? { msg: 'Judgement' } : { ok: false, msg: 'No Joker room' }) });

recolor('star', 'The Star', 'D', 'Turns up to 3 selected cards into ♦ Diamonds');
recolor('moon', 'The Moon', 'C', 'Turns up to 3 selected cards into ♣ Clubs');
recolor('sun', 'The Sun', 'H', 'Turns up to 3 selected cards into ♥ Hearts');
recolor('world', 'The World', 'S', 'Turns up to 3 selected cards into ♠ Spades');

// ---------------------------------------------------------------- Planet ----

const PLANETS = [
  ['pluto', 'Pluto', 'high_card'],
  ['mercury', 'Mercury', 'pair'],
  ['uranus', 'Uranus', 'two_pair'],
  ['venus', 'Venus', 'three'],
  ['saturn', 'Saturn', 'straight'],
  ['jupiter', 'Jupiter', 'flush'],
  ['earth', 'Earth', 'full_house'],
  ['mars', 'Mars', 'four'],
  ['neptune', 'Neptune', 'straight_flush'],
  ['planet_x', 'Planet X', 'five'],
  ['ceres', 'Ceres', 'flush_house'],
  ['eris', 'Eris', 'flush_five'],
];

for (const [key, name, hand] of PLANETS) {
  const h = HANDS.find((x) => x.key === hand);
  C({ key, name, type: 'planet', cost: 3, hand, sel: none,
    text: (G) => `Levels up ${h.name} (+${h.dChips} chips, +${h.dMult} Mult)`,
    apply: (G, sel, api) => { api.levelHand(hand, 1); return { msg: `${h.name} Lv.${G.handLevels[hand].level}` }; } });
}

/** Planets are only offered for hands the player has actually discovered. */
const PLANET_KEYS = PLANETS.map(([k]) => k);

// -------------------------------------------------------------- Spectral ----

const S = (key, name, sel, text, apply) =>
  C({ key, name, type: 'spectral', cost: 4, sel, text: () => text, apply });

S('familiar', 'Familiar', none,
  'Destroys 1 random card in hand, then adds 3 random Enhanced face cards',
  (G, sel, api) => {
    api.destroyRandomInHand(1);
    for (let i = 0; i < 3; i++) api.addRandomCard({ ranks: [11, 12, 13], enhanced: true });
    return { msg: 'Familiar' };
  });

S('grim', 'Grim', none,
  'Destroys 1 random card in hand, then adds 2 random Enhanced Aces',
  (G, sel, api) => {
    api.destroyRandomInHand(1);
    for (let i = 0; i < 2; i++) api.addRandomCard({ ranks: [14], enhanced: true });
    return { msg: 'Grim' };
  });

S('incantation', 'Incantation', none,
  'Destroys 1 random card in hand, then adds 4 random Enhanced numbered cards',
  (G, sel, api) => {
    api.destroyRandomInHand(1);
    for (let i = 0; i < 4; i++) api.addRandomCard({ ranks: [2, 3, 4, 5, 6, 7, 8, 9, 10], enhanced: true });
    return { msg: 'Incantation' };
  });

S('talisman', 'Talisman', pick(1, 1), 'Adds a Gold Seal to 1 selected card',
  (G, sel) => { sel[0].seal = 'gold'; return { msg: 'Gold Seal' }; });

S('deja_vu', 'Deja Vu', pick(1, 1), 'Adds a Red Seal to 1 selected card',
  (G, sel) => { sel[0].seal = 'red'; return { msg: 'Red Seal' }; });

S('trance', 'Trance', pick(1, 1), 'Adds a Blue Seal to 1 selected card',
  (G, sel) => { sel[0].seal = 'blue'; return { msg: 'Blue Seal' }; });

S('medium', 'Medium', pick(1, 1), 'Adds a Purple Seal to 1 selected card',
  (G, sel) => { sel[0].seal = 'purple'; return { msg: 'Purple Seal' }; });

S('aura', 'Aura', pick(1, 1), 'Adds Foil, Holographic or Polychrome to 1 selected card',
  (G, sel, api) => { sel[0].edition = api.rng.pick(['foil', 'holo', 'poly']); return { msg: 'Aura' }; });

S('wraith', 'Wraith', none, 'Creates a random Rare Joker, but sets your money to $0',
  (G, sel, api) => {
    if (!api.createJoker(3)) return { ok: false, msg: 'No Joker room' };
    api.setMoney(0);
    return { msg: 'Wraith' };
  });

S('sigil', 'Sigil', none, 'Converts every card in your hand to a single random suit',
  (G, sel, api) => {
    const suit = api.rng.pick(SUIT_KEYS);
    G.hand.forEach((c) => { if (!isStone(c)) c.suit = suit; });
    return { msg: 'Sigil' };
  });

S('ouija', 'Ouija', none, 'Converts every card in your hand to a single random rank. -1 hand size',
  (G, sel, api) => {
    const rank = api.rng.pick(RANKS);
    G.hand.forEach((c) => { if (!isStone(c)) c.rank = rank; });
    G.handSizeMod -= 1;
    return { msg: 'Ouija' };
  });

S('ectoplasm', 'Ectoplasm', none, 'Adds Negative to a random Joker. -1 hand size',
  (G, sel, api) => {
    const plain = G.jokers.filter((j) => j.edition !== 'negative');
    if (!plain.length) return { ok: false, msg: 'No Jokers' };
    api.rng.pick(plain).edition = 'negative';
    G.handSizeMod -= 1;
    return { msg: 'Negative!' };
  });

S('immolate', 'Immolate', none, 'Destroys 5 random cards in hand and gives $20',
  (G, sel, api) => { api.destroyRandomInHand(5); api.addMoney(20); return { msg: 'Immolate' }; });

S('ankh', 'Ankh', none, 'Copies a random Joker, then destroys all your other Jokers',
  (G, sel, api) => {
    if (!G.jokers.length) return { ok: false, msg: 'No Jokers' };
    const keep = api.rng.pick(G.jokers);
    const copy = api.copyJoker(keep);
    G.jokers = [keep, copy].filter(Boolean);
    return { msg: 'Ankh' };
  });

S('hex', 'Hex', none, 'Adds Polychrome to a random Joker and destroys all your other Jokers',
  (G, sel, api) => {
    if (!G.jokers.length) return { ok: false, msg: 'No Jokers' };
    const keep = api.rng.pick(G.jokers);
    keep.edition = 'poly';
    G.jokers = [keep];
    return { msg: 'Hex' };
  });

S('cryptid', 'Cryptid', pick(1, 1), 'Creates 2 copies of 1 selected card',
  (G, sel, api) => {
    for (let i = 0; i < 2; i++) api.addCard({ ...sel[0], id: uid('c') });
    return { msg: 'Cryptid' };
  });

S('soul', 'The Soul', none, 'Creates a Legendary Joker',
  (G, sel, api) => (api.createJoker(4) ? { msg: 'The Soul' } : { ok: false, msg: 'No Joker room' }));

S('black_hole', 'Black Hole', none, 'Upgrades every poker hand by 1 level',
  (G, sel, api) => { HANDS.forEach((h) => api.levelHand(h.key, 1)); return { msg: 'Black Hole' }; });

const CONSUMABLE_BY_KEY = Object.fromEntries(CONSUMABLES.map((c) => [c.key, c]));

/** These read or reshape the live hand, so they only work during a blind. */
const NEEDS_HAND = new Set(['familiar', 'grim', 'incantation', 'sigil', 'ouija', 'immolate']);

const TAROT_KEYS = CONSUMABLES.filter((c) => c.type === 'tarot').map((c) => c.key);
/** The Soul and Black Hole are treasures — they never show up in normal shops. */
const SPECTRAL_KEYS = CONSUMABLES.filter(
  (c) => c.type === 'spectral' && c.key !== 'soul' && c.key !== 'black_hole'
).map((c) => c.key);

function makeConsumable(key, edition = null) {
  const def = CONSUMABLE_BY_KEY[key];
  if (!def) throw new Error('unknown consumable: ' + key);
  return { id: uid('u'), key, type: def.type, cost: def.cost, edition };
}

function consumableText(item, G) {
  const def = CONSUMABLE_BY_KEY[item.key];
  return typeof def.text === 'function' ? def.text(G) : def.text;
}

function randomEnhancedCard(rng, { ranks = RANKS, suits = SUIT_KEYS, enhanced = false } = {}) {
  const c = makeCard(rng.pick(ranks), rng.pick(suits));
  if (enhanced) {
    c.enhancement = rng.pick(['bonus', 'mult', 'wild', 'glass', 'steel', 'gold', 'lucky']);
  }
  return c;
}

return { CONSUMABLES, PLANET_KEYS, CONSUMABLE_BY_KEY, NEEDS_HAND, TAROT_KEYS, SPECTRAL_KEYS, makeConsumable, consumableText, randomEnhancedCard };
});

__def('blinds.js', function () {
// Antes, blinds, boss abilities and the skip tags.

const { isFace, hasSuit } = __req('cards.js');

const ANTE_TABLE = [0, 300, 800, 2000, 5000, 11000, 20000, 35000, 50000];

/** Chip requirement of an ante's Small Blind. Endless play keeps escalating. */
function anteBase(ante) {
  if (ante <= 8) return ANTE_TABLE[ante];
  let v = ANTE_TABLE[8];
  for (let a = 9; a <= ante; a++) v = Math.round(v * (1.6 + 0.15 * (a - 8)));
  return v;
}

const BLIND_SLOTS = [
  { key: 'small', name: 'Small Blind', mult: 1, reward: 3, skippable: true },
  { key: 'big', name: 'Big Blind', mult: 1.5, reward: 4, skippable: true },
  { key: 'boss', name: 'Boss Blind', mult: 2, reward: 5, skippable: false },
];

/**
 * Boss abilities. Anything the engine needs to branch on lives in `flags`;
 * `debuff(card)` marks cards as dead weight for the whole round.
 */
const BOSSES = [
  { key: 'hook', name: 'The Hook', desc: 'Discards 2 random cards from your hand after every hand played',
    flags: { discardAfterPlay: 2 } },
  { key: 'ox', name: 'The Ox', desc: 'Playing your most-played hand sets your money to $0',
    flags: { oxPenalty: true } },
  { key: 'wall', name: 'The Wall', desc: 'Extra large blind — double the usual score',
    flags: { targetMult: 2 } },
  { key: 'needle', name: 'The Needle', desc: 'You get one hand only',
    flags: { handsOverride: 1 } },
  { key: 'water', name: 'The Water', desc: 'You start the round with 0 discards',
    flags: { discardsOverride: 0 } },
  { key: 'manacle', name: 'The Manacle', desc: '-1 hand size',
    flags: { handSize: -1 } },
  { key: 'psychic', name: 'The Psychic', desc: 'Every hand must be played with exactly 5 cards',
    flags: { mustPlay: 5 } },
  { key: 'eye', name: 'The Eye', desc: 'No hand type may be played more than once this round',
    flags: { noRepeatHand: true } },
  { key: 'mouth', name: 'The Mouth', desc: 'Only one hand type may be played this round',
    flags: { singleHandType: true } },
  { key: 'flint', name: 'The Flint', desc: 'Base chips and Mult of your played hand are halved',
    flags: { halveBase: true } },
  { key: 'tooth', name: 'The Tooth', desc: 'Lose $1 for every card you play',
    flags: { costPerCard: 1 } },
  { key: 'arm', name: 'The Arm', desc: 'Decreases the level of the hand you play by 1',
    flags: { downgrade: true } },
  { key: 'pillar', name: 'The Pillar', desc: 'Cards you already played this round are debuffed',
    flags: { pillar: true } },
  { key: 'club', name: 'The Club', desc: 'All ♣ Club cards are debuffed', debuff: (c) => hasSuit(c, 'C') },
  { key: 'goad', name: 'The Goad', desc: 'All ♠ Spade cards are debuffed', debuff: (c) => hasSuit(c, 'S') },
  { key: 'window', name: 'The Window', desc: 'All ♦ Diamond cards are debuffed', debuff: (c) => hasSuit(c, 'D') },
  { key: 'heart', name: 'The Heart', desc: 'All ♥ Heart cards are debuffed', debuff: (c) => hasSuit(c, 'H') },
  { key: 'plant', name: 'The Plant', desc: 'All face cards are debuffed', debuff: isFace },
  { key: 'serpent', name: 'The Serpent', desc: 'You always draw exactly 3 cards after playing or discarding',
    flags: { drawFixed: 3 } },
  { key: 'sun', name: 'The Sun', desc: 'All cards are drawn face down until you play a hand',
    flags: { blindDraw: true } },
];

/** Ante 8, 16, 24… get one of these instead. */
const FINISHERS = [
  { key: 'vessel', name: 'Violet Vessel', finisher: true, desc: 'A colossal blind — triple the usual score',
    flags: { targetMult: 3 } },
  { key: 'crimson', name: 'Crimson Heart', finisher: true, desc: 'One random Joker is switched off for each hand you play',
    flags: { disableJoker: true } },
  { key: 'bell', name: 'Cerulean Bell', finisher: true, desc: 'One random card in your hand is always forced to be selected',
    flags: { forceCard: true } },
];

const BOSS_BY_KEY = Object.fromEntries([...BOSSES, ...FINISHERS].map((b) => [b.key, b]));

function pickBoss(rng, ante, seen = new Set()) {
  if (ante % 8 === 0) return rng.pick(FINISHERS).key;
  const fresh = BOSSES.filter((b) => !seen.has(b.key));
  return rng.pick(fresh.length ? fresh : BOSSES).key;
}

/** Chip target for a given ante + blind slot, including any boss multiplier. */
function blindTarget(ante, blindIndex, bossKey) {
  const slot = BLIND_SLOTS[blindIndex];
  let target = Math.round(anteBase(ante) * slot.mult);
  if (blindIndex === 2 && bossKey) {
    const boss = BOSS_BY_KEY[bossKey];
    if (boss?.flags?.targetMult) target = Math.round(anteBase(ante) * boss.flags.targetMult);
  }
  return target;
}

// ------------------------------------------------------------------ Tags ----
// Rewards for skipping a Small or Big Blind.

const TAGS = [
  { key: 'uncommon', name: 'Uncommon Tag', desc: 'The next shop has a free Uncommon Joker' },
  { key: 'rare', name: 'Rare Tag', desc: 'The next shop has a free Rare Joker' },
  { key: 'investment', name: 'Investment Tag', desc: 'Earn $25 after defeating the next Boss Blind' },
  { key: 'handy', name: 'Handy Tag', desc: 'Earn $1 for every hand you have played this run' },
  { key: 'garbage', name: 'Garbage Tag', desc: 'Earn $1 for every discard you have not used this run' },
  { key: 'juggle', name: 'Juggle Tag', desc: '+3 hand size for the next round' },
  { key: 'voucher', name: 'Voucher Tag', desc: 'Adds one extra Voucher to the next shop' },
  { key: 'd6', name: 'D6 Tag', desc: 'Shop rerolls start at $0 for the next shop' },
  { key: 'economy', name: 'Economy Tag', desc: 'Doubles your money, up to a maximum of $40' },
  { key: 'charm', name: 'Charm Tag', desc: 'Immediately opens a free Mega Arcana Pack' },
  { key: 'meteor', name: 'Meteor Tag', desc: 'Immediately opens a free Mega Celestial Pack' },
  { key: 'buffoon', name: 'Buffoon Tag', desc: 'Immediately opens a free Mega Buffoon Pack' },
  { key: 'ethereal', name: 'Ethereal Tag', desc: 'Immediately opens a free Spectral Pack' },
  { key: 'standard', name: 'Standard Tag', desc: 'Immediately opens a free Mega Standard Pack' },
  { key: 'coupon', name: 'Coupon Tag', desc: 'Every Joker and consumable in the next shop is free' },
];

const TAG_BY_KEY = Object.fromEntries(TAGS.map((t) => [t.key, t]));
const pickTag = (rng) => rng.pick(TAGS).key;

return { anteBase, BLIND_SLOTS, BOSSES, FINISHERS, BOSS_BY_KEY, pickBoss, blindTarget, TAGS, TAG_BY_KEY, pickTag };
});

    events.push({ kind, refId, d, text: text ?? '', chips, mult });
  };
  const applyDelta = (d) => {
    chips += d.chips;
    mult += d.mult;
    mult *= d.xmult;
    moneyGained += d.money;
  };
  const apply = (res, kind, refId) => {
    if (!res) return;
    const d = { chips: res.chips ?? 0, mult: res.mult ?? 0, xmult: res.xmult ?? 1, money: res.money ?? 0 };
    applyDelta(d);
    if (res.createTarot) sideEffects.createTarot += res.createTarot;
    if (res.levelUpHand) sideEffects.levelUp += res.levelUpHand;
    if (res.cloneCard) sideEffects.clone.push(res.cloneCard);
    if (res.destroySelf) sideEffects.destroy.push(res.destroySelf === true ? refId : res.destroySelf);
    const visible = d.chips || d.mult || d.xmult !== 1 || d.money || res.msg;
    if (visible) push(kind, refId, d, res.msg);
  };

  events.push({ kind: 'base', refId: null, d: ZERO(), text: `${ev.name} · Lv.${stats.level}`, chips, mult });

  // Pre-scoring joker hooks (Midas, Vampire, DNA, Astronomer, counters…).
  const base = { played, scoring, hand: held, handKey, rng };
  for (const { joker, res } of fireJokers(G, 'onPlay', rng, base)) apply(res, 'joker', joker.id);

  const countRetriggers = (hookName, card) => {
    let n = 0;
    for (const j of G.jokers) {
      if (j.id === G.disabledJokerId) continue;
      const { def, host } = resolveJoker(G, j);
      n += def?.[hookName]?.(jokerCtx(G, host, base), card) ?? 0;
    }
    return n;
  };
  const runCardHook = (hookName, card) => {
    for (const j of G.jokers) {
      if (j.id === G.disabledJokerId) continue;
      const { def, host } = resolveJoker(G, j);
      if (typeof def?.[hookName] !== 'function') continue;
      apply(def[hookName](jokerCtx(G, host, base), card), 'joker', j.id);
    }
  };

  // --- scoring cards, left to right -----------------------------------------
  for (const card of scoring) {
    if (card.debuffed) { push('card', card.id, ZERO(), 'debuffed'); continue; }

    const triggers = 1 + (card.seal === 'red' ? 1 : 0) + countRetriggers('retrigger', card);

    for (let t = 0; t < triggers; t++) {
      const d = ZERO();
      d.chips += baseChips(card);
      switch (card.enhancement) {
        case 'bonus': d.chips += 30; break;
        case 'mult': d.mult += 4; break;
        case 'glass': d.xmult *= 2; break;
        case 'lucky':
          if (rng.chance(1, 5)) d.mult += 20;
          if (rng.chance(1, 15)) d.money += 20;
          break;
        default: break;
      }
      const ed = EDITION_FX[card.edition];
      if (ed) { d.chips += ed.chips ?? 0; d.mult += ed.mult ?? 0; d.xmult *= ed.xmult ?? 1; }
      if (card.seal === 'gold') d.money += 3;

      applyDelta(d);
      push('card', card.id, d, t > 0 ? 'again!' : null);
      runCardHook('scored', card);
    }

    if (card.enhancement === 'glass' && rng.chance(1, 4)) sideEffects.destroy.push(card.id);
  }

  // --- cards held in hand ---------------------------------------------------
  for (const card of held) {
    if (card.debuffed) continue;
    const triggers = 1 + (card.seal === 'red' ? 1 : 0) + countRetriggers('retriggerHeld', card);
    for (let t = 0; t < triggers; t++) {
      if (card.enhancement === 'steel') {
        const d = { ...ZERO(), xmult: 1.5 };
        applyDelta(d);
        push('held', card.id, d, null);
      }
      runCardHook('held', card);
    }
  }

  // --- independent joker effects, left to right -----------------------------
  for (const j of G.jokers) {
    if (j.id === G.disabledJokerId) { push('joker', j.id, ZERO(), 'disabled'); continue; }
    const { def, host } = resolveJoker(G, j);
    if (typeof def?.ind === 'function') apply(def.ind(jokerCtx(G, host, base)), 'joker', j.id);
    const ed = EDITION_FX[j.edition];
    if (ed) {
      const d = { ...ZERO(), ...ed, xmult: ed.xmult ?? 1 };
      applyDelta(d);
      push('joker', j.id, d, j.edition);
    }
  }

  // Observatory pays out for Planet cards you are still holding.
  if (G.vouchers.has('observatory')) {
    for (const u of G.consumables) {
      const def = CONSUMABLE_BY_KEY[u.key];
      if (def?.type === 'planet' && def.hand === handKey) {
        const d = { ...ZERO(), xmult: 1.5 };
        applyDelta(d);
        push('voucher', u.id, d, 'Observatory');
      }
    }
  }

  if (G.mods?.plasma) {
    const avg = (chips + mult) / 2;
    chips = avg; mult = avg;
    push('deck', null, ZERO(), 'Balanced');
  }

  const total = Math.round(chips * mult);
  events.push({ kind: 'total', refId: null, d: ZERO(), text: '', chips, mult, total });

  G.rngState = rng.state;
  return { events, total, handKey, handName: ev.name, level: stats.level, chips, mult, moneyGained, sideEffects, scoring, played };
}

/** Commit a scored hand: move cards, pay out, apply side effects, refill. */
function commitHand(G, result) {
  const boss = activeBoss(G);
  const flags = boss?.flags ?? {};

  G.score += result.total;
  G.hands -= 1;
  G.stats.handsPlayed += 1;
  if (result.total > G.stats.bestHandScore) {
    G.stats.bestHandScore = result.total;
    G.stats.bestHandName = result.handName;
  }

  if (result.moneyGained) G.money += result.moneyGained;
  if (flags.costPerCard) G.money -= flags.costPerCard * result.played.length;
  if (flags.oxPenalty && result.handKey === mostPlayedHand(G)) G.money = 0;
  G.money = Math.max(-20, G.money);

  withRng(G, (rng) => {
    // Destroy anything that shattered or self-destructed during scoring.
    for (const id of result.sideEffects.destroy) {
      const card = G.deck.find((c) => c.id === id);
      if (card) destroyCard(G, card, rng);
      const joker = G.jokers.find((j) => j.id === id);
      if (joker) removeJoker(G, joker);
    }
    for (let i = 0; i < result.sideEffects.createTarot; i++) addConsumable(G, makeConsumable(rng.pick(TAROT_KEYS)));
    for (const src of result.sideEffects.clone) {
      const copy = { ...src, id: uid('c') };
      G.deck.push(copy);
      G.hand.push(copy);
      fireJokers(G, 'onCardAdded', rng, {}, copy);
    }
    if (result.sideEffects.levelUp) levelHand(G, result.handKey, result.sideEffects.levelUp);

    // Played cards leave the hand.
    const playedIds = new Set(result.played.map((c) => c.id));
    G.hand = G.hand.filter((c) => !playedIds.has(c.id));
    for (const c of result.played) {
      if (G.deck.includes(c)) G.discardPile.push(c);
      if (flags.pillar) c.debuffed = true;
      G.playedThisRound.add(c.id);
    }

    G.selected = [];
    G.playedZone = result.played;
    if (G.faceDown) { G.faceDown = false; for (const c of G.deck) c.faceDown = false; }

    // The Hook eats two more cards after every hand.
    if (flags.discardAfterPlay && G.hand.length) {
      const doomed = rng.shuffle(G.hand.slice()).slice(0, flags.discardAfterPlay);
      G.hand = G.hand.filter((c) => !doomed.includes(c));
      G.discardPile.push(...doomed);
    }

    if (G.score < G.target && G.hands > 0) {
      drawUpTo(G, rng, flags.drawFixed ? G.hand.length + flags.drawFixed : null);
    }
  });

  if (G.score >= G.target) finishBlind(G);
  else if (G.hands <= 0) G.phase = 'game_over';

  recompute(G);
  return G;
}

function discardSelected(G) {
  if (discardBlocker(G)) return null;
  const cards = selectedCards(G);
  const flags = activeBoss(G)?.flags ?? {};

  G.discards -= 1;
  G.stats.discardsUsed += 1;
  G.stats.cardsDiscarded += cards.length;

  withRng(G, (rng) => {
    for (const { res } of fireJokers(G, 'onDiscard', rng, { hand: G.hand, rng }, cards)) {
      if (res?.money) G.money += res.money;
    }
    // Purple seals turn discards into Tarot cards.
    for (const c of cards) if (c.seal === 'purple') addConsumable(G, makeConsumable(rng.pick(TAROT_KEYS)));

    const ids = new Set(cards.map((c) => c.id));
    G.hand = G.hand.filter((c) => !ids.has(c.id));
    G.discardPile.push(...cards);
    G.selected = [];
    drawUpTo(G, rng, flags.drawFixed ? G.hand.length + flags.drawFixed : null);
  });

  recompute(G);
  return cards;
}

function mostPlayedHand(G) {
  let key = 'high_card', best = -1;
  for (const [k, v] of Object.entries(G.handLevels)) if (v.plays > best) { best = v.plays; key = k; }
  return key;
}

// ------------------------------------------------------------ Round end -----

function finishBlind(G) {
  const slot = BLIND_SLOTS[G.blindIndex];
  const lines = [];
  let total = 0;

  const add = (label, amount) => { if (amount) { lines.push({ label, amount }); total += amount; } };

  add(`${slot.name} reward`, slot.reward);
  add(`${G.hands} hand${G.hands === 1 ? '' : 's'} remaining`, G.hands * (G.mods?.handCash ?? 1));
  if (G.mods?.discardCash) add(`${G.discards} discards remaining`, G.discards * G.mods.discardCash);

  const cap = G.derived.interestCap;
  if (cap > 0 && G.money > 0) {
    const rate = 1 + G.derived.extraInterest;
    add('Interest', Math.min(cap, Math.floor(G.money / 5) * rate));
  }

  withRng(G, (rng) => {
    const goldHeld = G.hand.filter((c) => c.enhancement === 'gold').length;
    add('Gold cards held', goldHeld * 3);

    for (const c of G.hand) if (c.seal === 'blue') addConsumable(G, makeConsumable(rng.pick(PLANET_KEYS)));

    for (const { joker, res } of fireJokers(G, 'onRoundEnd', rng, { hand: G.hand, rng })) {
      if (res?.money) add(JOKER_BY_KEY[joker.key].name, res.money);
      if (res?.destroySelf) {
        removeJoker(G, joker);
        if (res.spawn && G.jokers.length < G.derived.jokerSlots) G.jokers.push(makeJoker(res.spawn));
      }
    }

    // Investment tags mature once a Boss Blind falls.
    if (G.blindIndex === 2) {
      const invest = G.tags.filter((t) => t.key === 'investment');
      if (invest.length) {
        add('Investment Tag', 25 * invest.length);
        G.tags = G.tags.filter((t) => t.key !== 'investment');
      }
      if (G.mods?.bossTag) G.tags.push({ id: uid('t'), key: pickTag(rng) });
    }
  });

  G.money += total;
  G.cashout = { lines, total, blindName: slot.name };
  G.phase = 'round_end';
  G.bossesSeen.add(G.bossKey);
  G.juggleRounds = Math.max(0, (G.juggleRounds ?? 0) - 1);
  G.stats.discardsAvailable = (G.stats.discardsAvailable ?? 0) + G.derived.discards;
  G.stats.mostPlayed = mostPlayedHand(G);
  return G.cashout;
}

/** Cash-out screen dismissed — advance the blind and open the shop. */
function leaveCashout(G) {
  const wasBoss = G.blindIndex === 2;
  if (wasBoss) {
    if (G.ante >= WIN_ANTE && !G.won) { G.won = true; G.phase = 'win'; return G; }
    G.ante += 1;
    G.blindIndex = 0;
    G.bossKey = null;
    G.bossRerolled = false;
    withRng(G, (rng) => rollUpcomingTags(G, rng));
  } else {
    G.blindIndex += 1;
  }
  enterShop(G);
  return G;
}

function continueEndless(G) {
  G.ante += 1;
  G.blindIndex = 0;
  G.bossKey = null;
  G.bossRerolled = false;
  withRng(G, (rng) => rollUpcomingTags(G, rng));
  enterShop(G);
  return G;
}

// ----------------------------------------------------------------- Shop -----

function enterShop(G) {
  recompute(G);
  withRng(G, (rng) => { G.shop = buildShop(rng, G); });

  // Cash in the shop-modifying tags the player is holding.
  const consume = (key) => {
    const i = G.tags.findIndex((t) => t.key === key);
    if (i < 0) return false;
    G.tags.splice(i, 1);
    return true;
  };
  if (consume('coupon')) G.shop.coupon = true;
  if (consume('d6')) G.shop.freeRerolls = true;
  if (consume('voucher')) {
    withRng(G, (rng) => {
      const taken = new Set(G.shop.vouchers.map((v) => v.key));
      const pool = availableVouchers(G.vouchers).filter((v) => !taken.has(v.key));
      if (pool.length) G.shop.vouchers.push({ id: uid('v'), key: rng.pick(pool).key });
    });
  }
  for (const rarity of [['uncommon', 2], ['rare', 3]]) {
    if (consume(rarity[0])) {
      withRng(G, (rng) => {
        const j = rollJoker(rng, G, { forceRarity: rarity[1] });
        G.shop.items.unshift({ id: uid('s'), kind: 'joker', payload: j, cost: 0, free: true });
      });
    }
  }

  G.phase = 'shop';
  return G;
}

function rerollShop(G) {
  const cost = rerollCost(G);
  if (G.money < cost) return false;
  G.money -= cost;
  const rerolls = G.shop.rerolls + 1;
  const keepVoucher = G.shop.vouchers[0] ?? null;
  const coupon = G.shop.coupon, freeRerolls = G.shop.freeRerolls;
  withRng(G, (rng) => { G.shop = buildShop(rng, G, { keepVoucher }); });
  Object.assign(G.shop, { rerolls, coupon, freeRerolls });
  return true;
}

function itemPrice(G, item) {
  return item.free ? 0 : discounted(G, item.cost);
}

function buyItem(G, itemId) {
  const idx = G.shop.items.findIndex((i) => i.id === itemId);
  if (idx < 0) return { ok: false, msg: 'Gone' };
  const item = G.shop.items[idx];
  const price = itemPrice(G, item);
  if (G.money < price) return { ok: false, msg: 'Not enough money' };

  if (item.kind === 'joker') {
    if (!hasJokerRoom(G, item.payload)) return { ok: false, msg: 'No Joker slots' };
    G.money -= price;
    G.jokers.push(item.payload);
    G.stats.jokersOwned += 1;
  } else if (item.kind === 'consumable') {
    if (G.consumables.length >= G.derived.consumableSlots) return { ok: false, msg: 'No consumable slots' };
    G.money -= price;
    G.consumables.push(item.payload);
  } else {
    G.money -= price;
    G.deck.push(item.payload);
    withRng(G, (rng) => fireJokers(G, 'onCardAdded', rng, {}, item.payload));
  }

  G.shop.items.splice(idx, 1);
  recompute(G);
  return { ok: true };
}

function hasJokerRoom(G, joker) {
  if (joker?.edition === 'negative') return true;
  return G.jokers.length < G.derived.jokerSlots;
}

function buyVoucher(G, voucherId) {
  const idx = G.shop.vouchers.findIndex((v) => v.id === voucherId);
  if (idx < 0) return { ok: false, msg: 'Gone' };
  const v = G.shop.vouchers[idx];
  const price = discounted(G, VOUCHER_BY_KEY[v.key]?.cost ?? 10);
  if (G.money < price) return { ok: false, msg: 'Not enough money' };
  G.money -= price;
  G.vouchers.add(v.key);
  G.shop.vouchers.splice(idx, 1);

  // Hieroglyph and Petroglyph literally roll the run back an ante.
  if (v.key === 'hieroglyph' || v.key === 'petroglyph') G.ante = Math.max(1, G.ante - 1);
  recompute(G);
  return { ok: true };
}

function buyPack(G, packId) {
  const idx = G.shop.packs.findIndex((p) => p.id === packId);
  if (idx < 0) return { ok: false, msg: 'Gone' };
  const p = G.shop.packs[idx];
  const price = discounted(G, p.cost);
  if (G.money < price) return { ok: false, msg: 'Not enough money' };
  G.money -= price;
  G.shop.packs.splice(idx, 1);
  withRng(G, (rng) => { G.pack = rollPack(rng, G, p.packKey); });
  G.returnPhase = 'shop';
  G.phase = 'pack';
  return { ok: true };
}

function leaveShop(G) {
  withRng(G, (rng) => {
    for (const { res } of fireJokers(G, 'onShopExit', rng, {})) {
      if (res?.negativeCopy && G.consumables.length) {
        const src = rng.pick(G.consumables);
        addConsumable(G, { ...makeConsumable(src.key), edition: 'negative' }, true);
      }
    }
  });
  G.shop = null;
  G.phase = 'blind_select';
  recompute(G);
  return G;
}

// ---------------------------------------------------------------- Packs -----

function pickFromPack(G, optionId) {
  const pack = G.pack;
  if (!pack) return { ok: false };
  const idx = pack.options.findIndex((o) => o.id === optionId);
  if (idx < 0) return { ok: false };
  const opt = pack.options[idx];

  if (opt.kind === 'joker') {
    if (!hasJokerRoom(G, opt.payload)) return { ok: false, msg: 'No Joker slots' };
    G.jokers.push(opt.payload);
  } else if (opt.kind === 'consumable') {
    if (G.consumables.length >= G.derived.consumableSlots) {
      // Slots are full, so the card has to be used on the spot. That is only
      // possible when it needs no target — otherwise there is nowhere to put it.
      const blocked = consumableBlocker(G, opt.payload);
      if (blocked) return { ok: false, msg: 'No consumable slots' };
      const used = useConsumableObject(G, opt.payload, []);
      if (used.ok === false) return { ok: false, msg: used.msg ?? 'No consumable slots' };
    } else {
      G.consumables.push(opt.payload);
    }
  } else {
    G.deck.push(opt.payload);
    withRng(G, (rng) => fireJokers(G, 'onCardAdded', rng, {}, opt.payload));
  }

  pack.options.splice(idx, 1);
  pack.picked += 1;
  recompute(G);
  if (pack.picked >= pack.choose || !pack.options.length) closePack(G);
  return { ok: true };
}

function closePack(G) {
  G.pack = null;
  G.phase = G.returnPhase ?? 'shop';
  G.returnPhase = null;
  if (G.phase === 'shop' && !G.shop) enterShop(G);
  recompute(G);
  return G;
}

// ----------------------------------------------------- Jokers & consumables --

function sellJoker(G, jokerId) {
  const j = G.jokers.find((x) => x.id === jokerId);
  if (!j) return false;
  const value = sellValue(j.cost);

  withRng(G, (rng) => {
    const { def, host } = resolveJoker(G, j);
    const res = def?.onSellSelf?.(jokerCtx(G, host, { rng }));
    if (res?.duplicateJoker) {
      const others = G.jokers.filter((x) => x !== j);
      if (others.length && G.jokers.length <= G.derived.jokerSlots) {
        const src = rng.pick(others);
        G.jokers.push({ ...makeJoker(src.key, src.edition), state: { ...src.state } });
      }
    }
    removeJoker(G, j);
    fireJokers(G, 'onSellOther', rng, {});
  });

  G.money += value;
  recompute(G);
  return true;
}

function sellConsumable(G, id) {
  const i = G.consumables.findIndex((c) => c.id === id);
  if (i < 0) return false;
  const [u] = G.consumables.splice(i, 1);
  G.money += Math.max(1, Math.floor(u.cost / 2));
  withRng(G, (rng) => fireJokers(G, 'onSellOther', rng, {}));
  recompute(G);
  return true;
}

function moveJoker(G, jokerId, toIndex) {
  const from = G.jokers.findIndex((j) => j.id === jokerId);
  if (from < 0) return;
  const [j] = G.jokers.splice(from, 1);
  G.jokers.splice(clamp(toIndex, 0, G.jokers.length), 0, j);
}

function removeJoker(G, j) {
  const i = G.jokers.indexOf(j);
  if (i >= 0) G.jokers.splice(i, 1);
}

function addConsumable(G, item, force = false) {
  if (!force && G.consumables.length >= G.derived.consumableSlots) return false;
  G.consumables.push(item);
  return true;
}

function consumableBlocker(G, item) {
  const def = CONSUMABLE_BY_KEY[item.key];
  const need = def.sel;
  const wantsHand = (need && need.max > 0) || NEEDS_HAND.has(item.key);
  if (wantsHand && G.phase !== 'playing') return 'Only usable during a blind';
  if (!need || need.max === 0) return null;
  const n = G.selected.length;
  if (n < need.min) return `Select ${need.min === need.max ? need.min : `${need.min}-${need.max}`} card${need.max > 1 ? 's' : ''}`;
  if (n > need.max) return `Select at most ${need.max}`;
  return null;
}

function useConsumable(G, id) {
  const i = G.consumables.findIndex((c) => c.id === id);
  if (i < 0) return { ok: false };
  const item = G.consumables[i];
  const sel = selectedCards(G);
  const out = useConsumableObject(G, item, sel);
  if (out.ok !== false) {
    G.consumables.splice(i, 1);
    G.selected = [];
  }
  return out;
}

function useConsumableObject(G, item, sel) {
  const def = CONSUMABLE_BY_KEY[item.key];
  if (!def) return { ok: false };
  // Guard the apply() functions: several index straight into `sel`.
  if (def.sel && sel.length < def.sel.min) return { ok: false, msg: 'Select a target card first' };

  let out = { ok: true };
  withRng(G, (rng) => {
    const api = makeApi(G, rng);
    const res = def.apply(G, sel, api) ?? {};
    if (res.ok === false) { out = res; return; }
    out = { ok: true, msg: res.msg ?? def.name };

    G.stats.lastConsumable = item.key;
    if (def.type === 'tarot') G.stats.tarotsUsed += 1;
    if (def.type === 'planet') { G.stats.planetsUsed += 1; fireJokers(G, 'onPlanetUsed', rng, {}); }
  });
  recompute(G);
  return out;
}

/** The surface consumables use to touch the run without importing game.js. */
function makeApi(G, rng) {
  return {
    rng,
    addMoney: (n) => { G.money += n; },
    setMoney: (n) => { G.money = n; },
    levelHand: (key, n) => levelHand(G, key, n),
    destroyCard: (c) => destroyCard(G, c, rng),
    destroyRandomInHand: (n) => {
      const pool = rng.shuffle(G.hand.slice()).slice(0, n);
      for (const c of pool) destroyCard(G, c, rng);
    },
    addCard: (c) => {
      const card = c.id && !G.deck.some((x) => x.id === c.id) ? c : { ...c, id: uid('c') };
      G.deck.push(card);
      if (G.phase === 'playing' && G.hand.length < G.derived.handSize) G.hand.push(card);
      fireJokers(G, 'onCardAdded', rng, {}, card);
      return card;
    },
    addRandomCard: (opts) => {
      const card = randomEnhancedCard(rng, opts);
      G.deck.push(card);

let enabled = true;
let master = null;

  master.gain.value = 0.28;
  master.connect(ctx.destination);

  const gain = c.createGain();

  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  osc.start(t0);
  osc.stop(t0 + dur + 0.02);

  const buf = c.createBuffer(1, frames, c.sampleRate);

  src.buffer = buf;

  filter.type = 'highpass';
  filter.frequency.value = hp;

  gain.gain.value = vol;
  src.connect(filter).connect(gain).connect(master);
  src.start(t0);

    return raw ? deserialize(raw) : null;
  } catch { return null; }
}

function clearRun() {
  try { localStorage.removeItem(RUN_KEY); } catch { /* ignore */ }

// Pixel art, drawn on a fixed grid and rendered as SVG rects.
//
// Everything here is deliberately low resolution and flat — no gradients, no
// soft edges, one colour per pixel. Horizontal runs are merged into single
// rects so a 16x16 face costs a few dozen nodes rather than 256.

const GRID = 16;

// A tight, saturated palette. Every colour in the game comes from this list.
const INK = '#12161c';

const SKINS = [
  ['#ffcf8f', '#e0a45f'],
  ['#ffe2c4', '#dfae86'],
  ['#c9eeb0', '#94c47a'],
  ['#ffc2cf', '#dd8fa2'],
  ['#bfe2ff', '#87b2dd'],
  ['#e8c9ff', '#b492d8'],
];
const HATS = [
  ['#e5484d', '#a82a2f'],
  ['#3d8bd6', '#245f9c'],
  ['#43ad63', '#25763e'],
  ['#7a54c9', '#4f3391'],
  ['#e8862b', '#b05c14'],
  ['#20a4a4', '#12706f'],
];
const TRIM = ['#ffd046', '#ffe8a3', '#f0f0e4'];

function hash(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function picker(key) {
  let h = hash(key);
  return (n) => { h = (Math.imul(h, 1664525) + 1013904223) >>> 0; return h % n; };
}

const put = (g, x, y, ch) => { if (g[y] && x >= 0 && x < g[y].length) g[y][x] = ch; };

  const h = g.length, w = g[0].length;
  const copy = g.map((r) => r.slice());
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (copy[y][x] !== '.') continue;
      const near = [[1, 0], [-1, 0], [0, 1], [0, -1]]
        .some(([dx, dy]) => copy[y + dy]?.[x + dx] && copy[y + dy][x + dx] !== '.' && copy[y + dy][x + dx] !== ch);

    let x = 0;
    while (x < w) {
      const ch = g[y][x];
      if (ch === '.') { x++; continue; }
      let run = 1;
      while (x + run < w && g[y][x + run] === ch) run++;
      const fill = colors[ch] ?? INK;
      out += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="${fill}"/>`;

function drawHead(g) {

  put(g, 3, 13, '.'); put(g, 12, 13, '.');

  box(g, 4, 11, 5, 12, 'd');
}

  // Wide open, single highlight pixel.
  (g) => { box(g, 5, 8, 6, 9, 'e'); box(g, 9, 8, 10, 9, 'e'); put(g, 5, 8, 'w'); put(g, 9, 8, 'w'); },
  // Big round with pupils.
  (g) => { box(g, 5, 8, 6, 9, 'w'); box(g, 9, 8, 10, 9, 'w'); put(g, 6, 9, 'e'); put(g, 10, 9, 'e'); },
  // Happy squints.
  (g) => { put(g, 5, 9, 'e'); put(g, 6, 8, 'e'); put(g, 7, 9, 'e'); put(g, 8, 9, 'e'); put(g, 9, 8, 'e'); put(g, 10, 9, 'e'); },
  // Cross eyes.
  (g) => {
    put(g, 5, 8, 'e'); put(g, 6, 9, 'e'); put(g, 6, 8, 'e'); put(g, 5, 9, 'e');

  // Sleepy half-lids.

];

  // Grin.
  (g) => { put(g, 6, 11, 'm'); box(g, 7, 12, 8, 12, 'm'); put(g, 9, 11, 'm'); },
  // Open mouth.
  (g) => { box(g, 6, 11, 9, 12, 'm'); put(g, 6, 11, 's'); put(g, 9, 11, 's'); },
  // Flat line.
  (g) => box(g, 6, 12, 9, 12, 'm'),
  // Frown.
  (g) => { put(g, 6, 12, 'm'); box(g, 7, 11, 8, 11, 'm'); put(g, 9, 12, 'm'); },
  // Toothy.
  (g) => { box(g, 6, 11, 9, 12, 'm'); put(g, 7, 11, 'w'); put(g, 8, 11, 'w'); },
  // Smirk.
  (g) => { box(g, 6, 12, 8, 12, 'm'); put(g, 9, 11, 'm'); },
];

const HAT_STYLES = [
  // Jester cap, three bells.
  (g) => {
    box(g, 4, 3, 11, 4, 'h');
    box(g, 5, 2, 10, 2, 'h');
    put(g, 2, 4, 't'); put(g, 2, 3, 'H');
    put(g, 7, 0, 't'); put(g, 7, 1, 'H'); put(g, 8, 1, 'H');
    put(g, 13, 4, 't'); put(g, 13, 3, 'H');
  },
  // Top hat.
  (g) => { box(g, 5, 0, 10, 3, 'h'); box(g, 5, 2, 10, 2, 't'); box(g, 3, 4, 12, 4, 'H'); },
  // Crown.
  (g) => {
    box(g, 4, 3, 11, 4, 't');
    put(g, 4, 1, 't'); put(g, 4, 2, 't');
    put(g, 7, 0, 't'); put(g, 8, 0, 't'); put(g, 7, 1, 't'); put(g, 8, 1, 't'); put(g, 7, 2, 't'); put(g, 8, 2, 't');
    put(g, 11, 1, 't'); put(g, 11, 2, 't');
    put(g, 7, 3, 'H'); put(g, 8, 3, 'H');
  },
  // Wizard cone.
  (g) => {
    put(g, 7, 0, 'h'); put(g, 8, 0, 'h');
    box(g, 6, 1, 9, 1, 'h'); box(g, 5, 2, 10, 2, 'h'); box(g, 4, 3, 11, 4, 'h');
    put(g, 6, 3, 't'); put(g, 9, 2, 't');
  },
  // Bare head with a tuft.
  (g) => { put(g, 6, 4, 'h'); put(g, 7, 3, 'h'); put(g, 8, 4, 'h'); put(g, 9, 3, 'h'); },
  // Bowler with a band.
  (g) => { box(g, 5, 1, 10, 3, 'h'); box(g, 5, 3, 10, 3, 'H'); box(g, 3, 4, 12, 4, 'h'); },

/** A cartoon joker portrait, generated from the joker's key. */
function jokerFace(key, accent = '#3d8bd6') {
  const pick = picker(key);
  const [skin, shade] = SKINS[pick(SKINS.length)];
  const [hat, hatDark] = HATS[pick(HATS.length)];
  const trim = TRIM[pick(TRIM.length)];
  const eyes = EYE_STYLES[pick(EYE_STYLES.length)];
  const mouth = MOUTH_STYLES[pick(MOUTH_STYLES.length)];
  const hatStyle = HAT_STYLES[pick(HAT_STYLES.length)];
  const blush = pick(2) === 0;

  const g = blank();
  drawHead(g);
  eyes(g);
  mouth(g);
  if (blush) { put(g, 4, 10, 'c'); put(g, 11, 10, 'c'); }
  hatStyle(g);
  outline(g);

  const colors = {
    o: INK, s: skin, d: shade, h: hat, H: hatDark, t: trim,

// Animation helpers. Everything here is decoration: if a caller skips these,
// the game still plays correctly, so each one degrades to a no-op cleanly.

const reduced = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** Wait for an element's running animations, with a hard ceiling. */
function settled(node, cap = 700) {
  if (!node?.getAnimations) return sleep(0);
  const running = node.getAnimations();
  if (!running.length) return sleep(0);
  return Promise.race([
    Promise.allSettled(running.map((a) => a.finished)),
    sleep(cap),
  ]);
}

/**
 * FLIP: move `node` as if it had travelled from `fromRect` to where it is now.
 * Used to fly cards from the hand into the play area without reparenting jank.
 */
function flipFrom(node, fromRect, { duration = 340, delay = 0, spin = 0 } = {}) {
  if (reduced()) return sleep(0);
  const to = node.getBoundingClientRect();
  const dx = fromRect.left - to.left;
  const dy = fromRect.top - to.top;
  if (!dx && !dy && !spin) return sleep(0);

  const anim = node.animate(
    [
      { transform: `translate(${dx}px, ${dy}px) rotate(${-spin}deg)`, offset: 0 },
      { transform: 'translate(0, 0) rotate(0deg)', offset: 1 },
    ],
    { duration, delay, easing: 'cubic-bezier(.2, .9, .3, 1.2)', fill: 'backwards' },
  );
  return anim.finished.catch(() => {});
}

/** Deal cards in with a staggered arc from the deck corner. */
function dealIn(nodes, { from = null, stagger = 45 } = {}) {
  if (reduced() || !nodes.length) return sleep(0);
  const origin = from ?? { left: window.innerWidth - 40, top: window.innerHeight - 60 };
  const last = nodes.map((node, i) => {
    const to = node.getBoundingClientRect();
    return node.animate(
      [
        {
          transform: `translate(${origin.left - to.left}px, ${origin.top - to.top}px) rotate(${18 + i * 3}deg) scale(.7)`,
          opacity: 0,
        },
        { transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1 },
      ],
      { duration: 320, delay: i * stagger, easing: 'cubic-bezier(.2,.9,.3,1.15)', fill: 'backwards' },
    ).finished.catch(() => {});
  });
  return Promise.allSettled(last);
}

/** Throw cards off the bottom of the screen — used for discards. */
function tossOut(nodes) {
  if (reduced() || !nodes.length) return sleep(0);
  return Promise.allSettled(nodes.map((node, i) => node.animate(
    [
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${(i % 2 ? 1 : -1) * (40 + i * 12)}px, 220px) rotate(${(i % 2 ? 1 : -1) * 55}deg)`, opacity: 0 },
    ],
    { duration: 320, delay: i * 35, easing: 'cubic-bezier(.5,0,.9,.4)', fill: 'forwards' },
  ).finished.catch(() => {})));
}

/** A short, sharp shake — scaled by how big the hit was. */
function shake(node, strength = 1) {
  if (reduced() || !node) return;
  const a = 4 * strength;
  node.animate(
    [
      { transform: 'translate(0,0)' },
      { transform: `translate(${-a}px, ${a * 0.6}px)` },
      { transform: `translate(${a}px, ${-a * 0.5}px)` },
      { transform: `translate(${-a * 0.6}px, 0)` },
      { transform: 'translate(0,0)' },
    ],
    { duration: 220 + 60 * strength, easing: 'ease-out' },
  );
}

/** Squash-and-stretch pop, for jokers and cards as they trigger. */
function pop(node, scale = 1.18) {
  if (reduced() || !node) return;
  node.animate(
    [
      { transform: 'scale(1,1) translateY(0)' },
      { transform: `scale(${scale * 0.94}, ${scale}) translateY(-14%)`, offset: 0.35 },
      { transform: `scale(${1 + (scale - 1) * 0.35}, ${1 - (scale - 1) * 0.25}) translateY(0)`, offset: 0.7 },
      { transform: 'scale(1,1) translateY(0)' },
    ],
    { duration: 380, easing: 'cubic-bezier(.2,1.4,.4,1)' },
  );
}

const CONFETTI = ['#ff5d55', '#29a8ff', '#f3b743', '#55d18b', '#b45be0', '#ffffff'];

/** Confetti burst from a point (or the screen centre). */
function burst(host, { x = window.innerWidth / 2, y = window.innerHeight / 2, count = 34 } = {}) {
  if (reduced() || !host) return;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const bit = document.createElement('i');
    bit.className = 'confetti';
    bit.style.left = `${x}px`;
    bit.style.top = `${y}px`;
    bit.style.background = CONFETTI[i % CONFETTI.length];
    if (i % 3 === 0) bit.style.borderRadius = '50%';
    frag.appendChild(bit);

    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 90 + Math.random() * 190;
    bit.animate(
      [
        { transform: 'translate(-50%, -50%) rotate(0deg) scale(1)', opacity: 1 },
        {
          transform: `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist + 140}px)) rotate(${Math.random() * 720 - 360}deg) scale(.4)`,
          opacity: 0,
        },
      ],
      { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.15,.7,.4,1)', fill: 'forwards' },
    ).finished.catch(() => {}).then(() => bit.remove());
  }

/** Stagger children into view — used for shop tiles and menu rows. */
function revealChildren(container, { stagger = 40, from = 12 } = {}) {
  if (reduced() || !container) return;
  const kids = [...container.children];
  kids.forEach((kid, i) => {
    kid.animate(
      [{ opacity: 0, transform: `translateY(${from}px) scale(.97)` }, { opacity: 1, transform: 'none' }],
      { duration: 260, delay: i * stagger, easing: 'cubic-bezier(.2,.9,.3,1.1)', fill: 'backwards' },
    );
  });
}

/** Flip a face-down card over. */
function flipReveal(node) {
  if (reduced() || !node) return sleep(0);
  return node.animate(
    [
      { transform: 'rotateY(0deg)' },
      { transform: 'rotateY(90deg)', offset: 0.5 },
      { transform: 'rotateY(0deg)' },
    ],
    { duration: 380, easing: 'ease-in-out' },
  ).finished.catch(() => {});
}

return { sleep, settled, flipFrom, dealIn, tossOut, shake, pop, burst, revealChildren, flipReveal };

// Interactive tutorial: a spotlight and a coach bubble that walk a new player
// through one real round. It never fakes the game — every step waits for the
// player to actually do the thing, on a live run.

const { el, $ } = __req('util.js');

const SEEN_KEY = 'jokerdeck.tutorial.done';

const hasSeenTutorial = () => {
  try { return localStorage.getItem(SEEN_KEY) === '1'; } catch { return false; }
};
const markTutorialSeen = () => {
  try { localStorage.setItem(SEEN_KEY, '1'); } catch { /* private mode */ }
};

 *   text    what the coach says
 *   target  CSS selector to spotlight (optional — omitted means centre screen)
 *   place   'above' | 'below' — which side of the target the bubble sits
 *   until   () => boolean, advance automatically once true
 *   button  label for a manual "next" when there is nothing to wait for
 *   enter   side effect when the step opens
 */
function steps(api) {
  const G = () => api.game();
  return [
    {
      text: "Welcome. The goal is simple: make poker hands worth enough chips to beat each blind. Let's play one round together.",
      button: 'Show me',
    },
    {
      text: 'This is the blind you are facing, and the score you have to beat. Tap here to start it.',
      target: '.sheet footer .btn.green',
      place: 'above',
      until: () => G()?.phase === 'playing',
    },
    {
      text: 'Here is your hand. Tap cards to select up to 5 of them — try to pick a pair, or just the two highest cards.',
      target: '#hand',
      place: 'above',
      until: () => (G()?.selected.length ?? 0) >= 2,
    },
    {
      text: 'See the readout? It names your hand and shows its base chips × Mult. Better hands start from much bigger numbers.',
      target: '#hand-name',
      place: 'above',
      button: 'Got it',
    },
    {
      text: 'Now play it. Watch the numbers on the left build up, then get multiplied by the number on the right.',
      target: '#btn-play',
      place: 'above',
      until: () => (G()?.stats.handsPlayed ?? 0) > 0,
    },
    {
      text: 'That score went toward the target at the top. You get a few hands per blind — the bar shows how close you are.',
      target: '#scoreline',
      place: 'below',
      button: 'Next',
    },
    {
      text: "Dealt a bad hand? Select the cards you don't want and Discard them for new ones. It costs a discard, not a hand.",
      target: '#btn-discard',
      place: 'above',
      button: 'Next',
    },
    {
      text: 'Jokers go here, and they are what actually win runs. They fire left to right after your cards score.',
      target: '#jokers',
      place: 'below',
      button: 'Next',
    },
    {
      text: 'Press and hold any card or Joker — at any time — to read exactly what it does. That is the whole rulebook.',
      target: '#hand',
      place: 'above',
      button: 'Next',
    },
    {
      text: 'Beat the blind and you reach the shop, where you buy Jokers, Planet cards that level up a hand forever, and booster packs. That is the loop. Good luck.',
      button: 'Play',
      last: true,
    },
  ];
}

function startTutorial(api) {
  const list = steps(api);
  let i = 0;
  let poll = null;

  const layer = el('div.tut-layer', { 'aria-live': 'polite' });
  const hole = el('div.tut-hole');
  const bubble = el('div.tut-bubble');
  layer.append(hole, bubble);
  document.body.appendChild(layer);

  const cleanup = () => {
    clearInterval(poll);
    layer.remove();
    markTutorialSeen();
    api.onDone?.();
  };

  const position = (step) => {
    const node = step.target ? $(step.target) : null;
    if (!node) {
      hole.style.opacity = '0';
      bubble.style.left = '50%';
      bubble.style.top = '50%';
      bubble.style.transform = 'translate(-50%, -50%)';
      return;
    }
    const r = node.getBoundingClientRect();
    const pad = 8;
    hole.style.opacity = '1';
    hole.style.left = `${r.left - pad}px`;
    hole.style.top = `${r.top - pad}px`;
    hole.style.width = `${r.width + pad * 2}px`;
    hole.style.height = `${r.height + pad * 2}px`;

    bubble.style.transform = 'none';
    const bw = Math.min(320, window.innerWidth - 24);
    bubble.style.width = `${bw}px`;
    let left = r.left + r.width / 2 - bw / 2;
    left = Math.max(12, Math.min(left, window.innerWidth - bw - 12));
    bubble.style.left = `${left}px`;

    // Measure after width is applied so the height is real.
    const bh = bubble.offsetHeight;
    let top = step.place === 'below' ? r.bottom + 14 : r.top - bh - 14;
    if (top < 12) top = r.bottom + 14;
    if (top + bh > window.innerHeight - 12) top = Math.max(12, r.top - bh - 14);
    bubble.style.top = `${top}px`;
  };

  const render = () => {
    const step = list[i];
    if (!step) return cleanup();

    step.enter?.();
    bubble.replaceChildren(
      el('div.tut-count', { text: `${i + 1} / ${list.length}` }),
      el('p.tut-text', { text: step.text }),
      el('div.tut-actions', {}, [
        step.button
          ? el('button.btn.tiny.tut-next', { text: step.button, onclick: () => advance() })
          : el('span.tut-hint', { text: 'Go ahead — I will wait.' }),
        el('button.tut-skip', { text: 'Skip', onclick: cleanup }),
      ]),
    );

    // Two frames: one for layout, one for the measured reposition.
    requestAnimationFrame(() => { position(step); requestAnimationFrame(() => position(step)); });

    clearInterval(poll);
    if (step.until) {
      poll = setInterval(() => {
        if (step.until()) advance();
        else position(step);
      }, 220);
    } else {
      poll = setInterval(() => position(step), 400);
    }
  };

  const advance = () => {
    clearInterval(poll);
    i += 1;
    if (i >= list.length) return cleanup();
    render();
  };

  window.addEventListener('resize', () => position(list[i]));
  render();
  return { stop: cleanup };
}

return { hasSeenTutorial, markTutorialSeen, startTutorial };
});
